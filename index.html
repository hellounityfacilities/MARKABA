  const rows = DB.companies.map(c => { const prev = DB.currentCompanyId; DB.currentCompanyId = c.id; const r = { c, veh: c.vehicles.filter(v => v.status !== 'sold').length, cash: sum(cashAccounts(), a => accBalance(a.code)), net: profitAndLoss(ytd(), today()).net }; DB.currentCompanyId = prev; return r; });
  return ph(t('Companies & branches'), { eyebrow: t('Administration'), sub: t('Each company keeps its own books, stock and numbering. Switch company from the top bar.'), actions: btn(t('New company'), 'newCompany', { cls: 'primary' }) + btn(t('Add branch'), 'newBranch') }) +
    card(t('Companies'), table([{ h: t('Company'), f: r => `<b>${esc(nm(r.c))}</b>${r.c.id === cur.id ? ' ' + badge('active', t('current')) : ''}<div class="muted small">${esc(r.c.crNo)} · ${esc(r.c.settings.currency)}</div>` }, { h: t('Branches'), f: r => r.c.branches.map(b => esc(nm(b))).join(', ') }, { h: t('Vehicles'), cls: 'num', f: r => r.veh }, { h: t('Bank & cash'), cls: 'num', f: r => money(r.cash) }, { h: t('Net profit YTD'), cls: 'num', f: r => money(r.net) }, { h: '', f: r => r.c.id === cur.id ? '' : btn(t('Switch'), 'switchCo', { id: r.c.id, cls: 'sm' }) }], rows), { flush: true });
};
ACT.switchCo = id => { DB.currentCompanyId = id; saveDB(); go('dash'); };
ACT.newCompany = () => modal({ title: t('New company'), body: `<div class="grid g2">${F('name', t('Company name'), { req: 1 })}${F('nameAr', t('Arabic name'))}${F('crNo', t('CR no.'))}${F('currency', t('Currency'), { value: 'QAR' })}${F('taxRate', t('Tax rate %'), { type: 'number', value: 0 })}${F('branch', t('First branch'), { value: 'Main showroom' })}${F('capital', t('Opening capital (optional)'), { type: 'number' })}${F('date', t('Opening date'), { type: 'date', value: today() })}</div><div class="muted small">${t('The new company starts with the full dealer chart of accounts in English and Arabic.')}</div>`,
  submit: t('Create'), ok: t('Company created'), onSubmit: x => { const c = newCompany({ ...x, taxRate: Number(x.taxRate) || 0 }); DB.companies.push(c); DB.currentCompanyId = c.id; audit('Company created', c.name); if (Number(x.capital) > 0) manualJournal({ date: x.date, memo: 'Opening capital', lines: [{ acc: '1030', dr: Number(x.capital) }, { acc: '3100', cr: Number(x.capital) }] }); }, after: () => go('dash') });
ACT.newBranch = () => modal({ title: t('Add branch'), body: `<div class="grid g2">${F('name', t('Branch name'), { req: 1 })}${F('nameAr', t('Arabic name'))}</div>`, submit: t('Add'), ok: t('Branch added'), onSubmit: x => { co().branches.push({ id: uid(), name: x.name, nameAr: x.nameAr || x.name }); audit('Branch added', x.name); } });
VIEWS.users = () => ph(t('Users & roles'), { eyebrow: t('Administration'), sub: t('Roles decide which areas a person sees. In this demo you can sign in as anyone from the top bar.'), actions: btn(t('Add user'), 'newUser', { cls: 'primary' }) }) +
  `<div class="cols"><div>${card(null, table([{ h: t('Name'), f: u => `<b>${esc(u.name)}</b>` }, { h: t('Role'), f: u => `<select data-act-change="role" data-id="${u.id}" aria-label="${t('Role')}">${Object.keys(ROLES).map(r => `<option value="${r}"${r === u.role ? ' selected' : ''}>${esc(t(ROLES[r].label))}</option>`).join('')}</select>` }], DB.users), { flush: true })}</div><div>${card(t('What each role sees'), table([{ h: t('Role'), f: ([k, r]) => t(r.label) }, { h: t('Areas'), f: ([k, r]) => r.areas.includes('*') ? t('Everything, including administration') : r.areas.map(a => t({ dash: 'Dashboard', sales: 'Sales', stock: 'Stock', rental: 'Rental', workshop: 'Workshop', parts: 'Parts', reports: 'Reports', customers: 'Contacts', finance: 'Finance', payroll: 'Payroll' }[a])).join(', ') }], Object.entries(ROLES)), { flush: true })}</div></div>`;
VIEW_AFTER.users = () => document.querySelectorAll('[data-act-change=role]').forEach(s => s.addEventListener('change', () => { const u = DB.users.find(x => x.id === s.dataset.id); if (u.id === 'u-admin' && s.value !== 'admin' && DB.users.filter(x => x.role === 'admin').length === 1) { toast(t('Keep at least one administrator.'), 'bad'); render(); return; } u.role = s.value; audit('Role changed', u.name + ' → ' + u.role); saveDB(); render(); toast(t('Role updated')); }));
ACT.newUser = () => modal({ title: t('Add user'), body: `<div class="grid g2">${F('name', t('Name'), { req: 1 })}${F('role', t('Role'), { type: 'select', options: Object.keys(ROLES).map(r => [r, t(ROLES[r].label)]) })}</div>`, submit: t('Add'), ok: t('User added'), onSubmit: x => { DB.users.push({ id: uid(), name: x.name, role: x.role }); audit('User added', x.name); } });
VIEWS.settings = () => {
  const c = co(); const s = c.settings;
  const f = (k, l, o) => F(k, l, { ...o, value: s[k] });
  return ph(t('Settings'), { eyebrow: t('Administration'), sub: esc(nm(c)) }) + `<form id="set-form" class="stack" style="max-width:980px">` +
    card(t('Company'), `<div class="grid g3">${F('co.name', t('Company name'), { value: c.name })}${F('co.nameAr', t('Arabic name'), { value: c.nameAr })}${F('co.crNo', t('CR no.'), { value: c.crNo })}${F('co.city', t('City'), { value: c.city })}${f('currency', t('Currency'))}${f('taxName', t('Tax name'))}${f('taxRate', t('Tax rate %'), { type: 'number' })}${f('creditDays', t('Default credit days'), { type: 'number' })}${f('alertDays', t('Alert window (days)'), { type: 'number' })}</div>`) +
    card(t('Sales'), `<div class="grid g3">${f('commissionRate', t('Default commission % of gross profit'), { type: 'number' })}${f('installmentRate', t('Default installment flat rate % p.a.'), { type: 'number' })}</div>`) +
    card(t('Rental'), `<div class="grid g3">${f('fuelFull', t('Default full-tank charge'), { type: 'number' })}${f('fineFee', t('Fine handling fee'), { type: 'number' })}${f('depositHoldDays', t('Deposit hold for fines (days)'), { type: 'number' })}</div>`) +
    card(t('Workshop & payroll'), `<div class="grid g3">${f('labourRate', t('Labour rate / hour (billed)'), { type: 'number' })}${f('labourCostRate', t('Labour cost / hour (internal)'), { type: 'number' })}${f('serviceInterval', t('Service interval (km)'), { type: 'number' })}${f('eosbDaysPerYear', t('Gratuity days per year of service'), { type: 'number' })}</div>`) +
    `<div>${btn(t('Save settings'), 'saveSettings', { cls: 'primary' })}</div></form>`;
};
ACT.saveSettings = () => run(() => { const x = readForm(document.getElementById('set-form')); const c = co(); Object.assign(c, { name: x.co.name, nameAr: x.co.nameAr, crNo: x.co.crNo, city: x.co.city }); delete x.co; for (const k in x) c.settings[k] = typeof c.settings[k] === 'number' ? Number(x[k]) : x[k]; audit('Settings saved'); }, t('Settings saved'));
VIEWS.audit = () => { const a = co().audit.filter(x => matchQ('aud', x.action, x.ref, x.user)).slice(0, 400); return ph(t('Audit log'), { eyebrow: t('Administration'), sub: t('Who did what and when. Journals themselves are append-only.') }) + `<div class="filters">${searchBox('aud', t('Search'))}</div>` + card(null, table([{ h: t('When'), f: x => `<span class="nowrap small">${esc(x.ts.replace('T', ' ').slice(0, 19))}</span>` }, { h: t('User'), f: x => esc(x.user) }, { h: t('Action'), f: x => esc(t(x.action)) }, { h: t('Reference'), f: x => esc(x.ref) }], a), { flush: true }); };
VIEWS.backup = () => ph(t('Backup & restore'), { eyebrow: t('Administration'), sub: t('Data is saved in this browser. Copy a backup to keep it safe or move it to another computer.') }) +
  `<div class="cols even">${card(t('Back up'), `<p class="muted" style="margin-top:0">${t('Copies every company, user and transaction as JSON.')}</p>${btn(t('Copy backup'), 'copyBackup', { cls: 'primary' })}`)}${card(t('Restore'), `<p class="muted" style="margin-top:0">${t('Paste a backup or choose a file. This replaces all current data.')}</p><div class="stack" style="gap:10px"><input type="file" id="bk-file" accept=".json,application/json" aria-label="${t('Backup file')}"><textarea id="bk-text" placeholder="{ … }" aria-label="${t('Backup JSON')}"></textarea><div>${btn(t('Restore'), 'restore', { cls: 'danger' })}</div></div>`)}</div><div style="height:16px"></div>` +
  card(t('Demo data'), `<p class="muted" style="margin-top:0">${t('Reload the two demo companies with fresh dates. Your changes will be lost.')}</p>${btn(t('Reset demo data'), 'resetDemo', { cls: 'danger' })}`);
VIEW_AFTER.backup = () => { const f = document.getElementById('bk-file'); if (f) f.addEventListener('change', () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { document.getElementById('bk-text').value = r.result; }; r.readAsText(file); }); };
ACT.copyBackup = () => copyText(JSON.stringify(DB), t('Backup copied'));
ACT.restore = () => { const txt = document.getElementById('bk-text').value.trim(); if (!txt) return toast(t('Paste a backup first.'), 'bad'); let d; try { d = JSON.parse(txt); } catch (e) { return toast(t('That is not valid backup JSON.'), 'bad'); } if (!d.companies || !d.users) return toast(t('That is not a Markaba backup.'), 'bad'); confirmBox(t('Restore backup'), t('Replace all current data with this backup?'), () => { DB = d; LANG = DB.lang || 'en'; SESSION.userId = DB.sessionUser || DB.users[0].id; ROUTE = 'dash'; }, t('Restore')); };
ACT.resetDemo = () => confirmBox(t('Reset demo data'), t('Replace everything with fresh demo data?'), () => { seedDemo(); DB.lang = LANG; ROUTE = 'dash'; }, t('Reset'));

/* ==========================================================================
   MARKABA — boot
   ========================================================================== */
'use strict';
function boot() {
  DB = loadDB();
  if (!DB) { seedDemo(); }
  LANG = DB.lang || 'en';
  SESSION.userId = DB.sessionUser && DB.users.find(u => u.id === DB.sessionUser) ? DB.sessionUser : DB.users[0].id;
  if (!DB.companies.find(c => c.id === DB.currentCompanyId)) DB.currentCompanyId = DB.companies[0].id;
  const h = (location.hash || '').slice(1); if (h && VIEWS[h] && !h.includes(':')) ROUTE = h;
  bindEvents(); render(); saveDB();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
