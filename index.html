const SRCH = { q: '', sel: 0, hits: [] };
const squash = s => String(s || '').toLowerCase().replace(/[\s\-·.]/g, '');
function searchAll(q) {

  const score = (...fields) => { let best = 0; for (const f of fields) { if (!f) continue; const a = String(f).toLowerCase(), b = squash(f); if (a === raw || b === sq) best = Math.max(best, 100); else if (a.startsWith(raw) || b.startsWith(sq)) best = Math.max(best, 70); else if (a.includes(raw) || b.includes(sq)) best = Math.max(best, 40); } return best; };

  for (const v of c.vehicles) add('Vehicles', score(v.vin, v.plate, v.stockNo, vname(v), v.make + ' ' + v.model, v.color), vname(v), [v.stockNo, v.plate, v.vin].filter(Boolean).join(' · '), 'vehicle:' + v.id, badge(v.status));

  for (const d of c.deals) { const v = vehicle(d.vehicleId); add('Deals', score(d.no), d.no + ' · ' + vname(v), nm(party(d.customerId)) + ' · ' + fdate(d.date), 'deal:' + d.id, badge(d.status)); }
  for (const k of c.contracts) add('Rental agreements', score(k.no), k.no + ' · ' + vehicle(k.vehicleId).plate, nm(party(k.customerId)) + ' · ' + fdate(k.out.date), 'contract:' + k.id, badge(k.status));
  for (const i of c.invoices) add('Invoices', score(i.no), i.no + ' · ' + money(i.total), nm(party(i.partyId)) + ' · ' + i.desc, 'invoice:' + i.id, badge(invStatus(i), STATUS_LABEL(invStatus(i))));

  for (const x of c.payments) add('Payments', score(x.no, x.ref), x.no + ' · ' + money(x.amount), nm(party(x.partyId)) + ' · ' + fdate(x.date), 'print:payment:' + x.id, '');
  for (const j of c.journals) add('Journals', score(j.no) || (raw.length > 3 ? Math.min(30, score(j.memo)) : 0), j.no, fdate(j.date) + ' · ' + j.memo, 'journal:' + j.id, '');
  for (const j of c.jobs) add('Job cards', score(j.no, j.plate), j.no + ' · ' + j.carDesc, (j.plate || '') + ' · ' + t(j.billing), 'job:' + j.id, badge(j.status));
  for (const it of c.items) add('Parts', score(it.code, it.name, it.nameAr, it.bin), it.code + ' · ' + nm(it), t('On hand') + ' ' + it.qty + ' ' + it.unit, 'parts', '');
  for (const pd of c.pdcs) add('Cheques', score(pd.chequeNo, pd.no), '#' + pd.chequeNo + ' · ' + money(pd.amount), nm(party(pd.partyId)) + ' · ' + fdate(pd.chequeDate), 'pdc', badge(pd.status));
  for (const d of (c.drafts || [])) add('Journals', score(d.no), d.no + ' · ' + d.memo, d.preparedBy, 'draft:' + d.id, '');

}

    const c = co(); const tab = uiTab('rem', 'queue'); const q = reminderQueue(); const log = (c.comms || []).filter(m => m.channel !== 'skipped');
    const kinds = Object.keys(REM_KINDS).map(k => [k, q.filter(r => r.kind === k).length]).filter(x => x[1]);
    const head = ph(t('Customer reminders'), { eyebrow: t('Contacts'), sub: t('Worked out from the books every time you open this page. Open WhatsApp or copy the SMS text, send it, then mark it sent — every message is kept on the customer’s record.'), actions: `<button class="btn" data-go="settings">${t('Edit message templates')}</button>` }) +

    if (tab === 'log') return head + card(null, table([{ h: t('When'), f: m => `<span class="small nowrap">${esc(m.ts.replace('T', ' ').slice(0, 16))}</span>` }, { h: t('Customer'), f: m => `<a href="#" data-go="party:${m.partyId}">${esc(nm(party(m.partyId)))}</a>` }, { h: t('Reminder'), f: m => esc(t(REM_KINDS[m.kind][0])) }, { h: t('Channel'), f: m => badge(m.channel === 'WhatsApp' ? 'cleared' : 'info', m.channel) }, { h: t('Message'), f: m => `<span class="small">${esc(m.text)}</span>` }, { h: t('By'), f: m => esc(m.by) }], log.slice(0, 200), { empty: t('Nothing sent yet.') }), { flush: true });

      (rows.length ? `<div class="rem-list">${rows.map((r, i) => {
        const p = party(r.partyId); const lang = REM.lang[r.key] || partyLang(p); const text = reminderText(r, lang); const wa = waNumber(p.phone);
        return `<article class="rem"><header><span class="b ${/overdue/.test(r.kind) ? 'bad' : r.kind === 'return_due' || r.kind === 'inst_due' || r.kind === 'pdc_due' ? 'warn' : 'info'}">${t(REM_KINDS[r.kind][0])}</span><a href="#" data-go="${r.go}" class="small">${t('Open record')}</a></header>
          <div class="rem-who"><b>${esc(nm(p))}</b> <span class="muted small nowrap" dir="ltr">${esc(p.phone || t('no phone'))}</span></div>
          <div class="rem-msg" dir="${lang === 'ar' ? 'rtl' : 'ltr'}" lang="${lang}">${esc(text)}</div>
          <footer><div class="seg sm-seg">${['en', 'ar'].map(l => `<label><input type="radio" name="rl-${i}" data-act="remLang" data-id="${esc(r.key)}" data-arg="${l}" ${l === lang ? 'checked' : ''}>${l === 'en' ? 'EN' : 'ع'}</label>`).join('')}</div>
          ${wa ? `<a class="btn sm primary" href="https://wa.me/${wa}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}${btn(t('Copy SMS text'), 'remCopy', { id: r.key, arg: lang, cls: 'sm' })}${btn(t('Mark as sent'), 'remSent', { id: r.key, arg: lang, cls: 'sm' })}${btn(t('Skip'), 'remSkip', { id: r.key, cls: 'sm ghost' })}</footer></article>`;
      }).join('')}</div>` : card(null, `<div class="empty">${t('No reminders to send right now.')}</div>`)) +
      `<p class="muted small" style="margin-top:14px">${t('Sending without a click needs an SMS gateway (Ooredoo or Vodafone Qatar business SMS) or the WhatsApp Business API — part of the production build.')}</p>`;
  };
  const remByKey = key => reminderQueue().find(r => r.key === key);

  ACT.remCopy = (key, lang) => { const r = remByKey(key); if (r) copyText(reminderText(r, lang), t('Message copied — paste it into your SMS app, then mark it sent.')); };

  ACT.remSkip = key => { const r = remByKey(key); if (r) run(() => logMessage(r, 'skipped', ''), t('Skipped')); };
}

'use strict';
/* ---------------- approvals inbox ---------------- */
const APR_LABEL = { discount: 'Price / discount', refund: 'Deposit refund', leave: 'Leave request' };
const reasonTxt = r => String(r).replace(/^Below minimum price (.*)$/, (m, a) => t('Below minimum price') + ' ' + a).replace(/^Discount (.*)% is over the (.*)% limit$/, (m, a, b) => LANG === 'ar' ? `الخصم ${a}% يتجاوز الحد المسموح ${b}%` : m);
function aprSummary(a) { if (a.type === 'leave') return ''; if (a.type === 'discount') { const d = byId('deals', a.refId); if (d && d.approval && d.approval.reasons) return d.approval.reasons.map(reasonTxt).join(' · '); } return a.summary; }
function aprRef(a) {
  if (a.type === 'discount' || a.type === 'refund') { const d = byId('deals', a.refId); if (!d) return ['', '']; return [`${d.no} · ${esc(vname(vehicle(d.vehicleId)))}`, 'deal:' + d.id, `${esc(nm(party(d.customerId)))} · ${t('Net price')} ${money0(dealCalc(d).net)} · ${t('Minimum price')} ${money0(vehicle(d.vehicleId).minPrice)}`]; }
  if (a.type === 'leave') { const l = byId('leaves', a.refId); const e = employee(l.employeeId); return [`${esc(nm(e))} · ${t(l.type)} · ${l.days} ${t('days')}`, 'payroll', `${fdate(l.from)} → ${fdate(l.to)}${l.reason ? ' · ' + esc(l.reason) : ''} · ${t('Annual leave left')} ${leaveEntitlement(e, l.from.slice(0, 4)) - leaveTaken(e, l.from.slice(0, 4))}`]; }
  return ['', ''];
}
VIEWS.approvals = () => {
  const c = co(); const tab = uiTab('apr', 'pending'); const all = (c.approvals || []).filter(a => a.status !== 'superseded').slice().reverse();
  const pend = all.filter(a => a.status === 'pending'); const drafts = (c.drafts || []).filter(d => d.status === 'submitted');
  const head = ph(t('Approvals'), { eyebrow: t('Controls'), sub: t('Discounts over the limit or below the minimum price, deposit refunds, leave requests and manual journals wait here for a second person.') }) +
    tabs('apr', [['pending', t('Waiting'), pend.length + drafts.length], ['done', t('Decided'), all.length - pend.length]], tab);
  if (tab === 'done') return head + card(null, table([{ h: t('Request'), f: a => `<b>${a.no}</b><div class="muted small">${fdate(a.ts.slice(0, 10))}</div>` }, { h: t('Type'), f: a => t(APR_LABEL[a.type]) }, { h: t('Details'), f: a => { const r = aprRef(a); return `<a href="#" data-go="${r[1]}">${r[0]}</a>`; } }, { h: t('Requested by'), f: a => esc(a.requestedBy) }, { h: t('Decision'), f: a => badge(a.status === 'approved' ? 'cleared' : 'bounced', t(a.status === 'approved' ? 'Approved' : 'Rejected')) + `<div class="muted small">${esc(a.decidedBy || '')}${a.reason ? ' · ' + esc(a.reason) : ''}</div>` }], all.filter(a => a.status !== 'pending')), { flush: true });
  const cards = pend.map(a => { const r = aprRef(a); const can2 = canDecide(a); return `<article class="rem"><header><span class="b ${a.type === 'refund' ? 'bad' : a.type === 'discount' ? 'warn' : 'info'}">${t(APR_LABEL[a.type])}</span><span class="muted small">${a.no} · ${fdate(a.ts.slice(0, 10))}</span></header>
    <div><a href="#" data-go="${r[1]}"><b>${r[0]}</b></a><div class="muted small">${r[2] || ''}</div></div>
    ${aprSummary(a) || a.amount ? `<div class="rem-msg">${esc(aprSummary(a))}${a.amount ? `<div><b>${money(a.amount)} ${curr()}</b></div>` : ''}</div>` : ''}
    <div class="muted small">${t('Requested by')} ${esc(a.requestedBy)}</div>
    <footer>${can2 ? btn(t('Approve'), 'aprYes', { id: a.id, cls: 'sm primary' }) + btn(t('Reject'), 'aprNo', { id: a.id, cls: 'sm danger' }) : `<span class="muted small">${a.requestedBy === user().name ? t('Waiting for a manager.') : t('Only a manager or administrator can approve.')}</span>`}</footer></article>`; }).join('');
  const dj = drafts.map(d => `<article class="rem"><header><span class="b info">${t('Manual journal')}</span><span class="muted small">${d.no}</span></header><div><a href="#" data-go="draft:${d.id}"><b>${esc(d.memo)}</b></a><div class="muted small">${fdate(d.date)} · ${money(sum(d.lines, l => l.dr))}</div></div><div class="muted small">${t('Prepared by')} ${esc(d.preparedBy)}</div><footer><button class="btn sm" data-go="draft:${d.id}">${t('Review')}</button></footer></article>`).join('');
  return head + (cards || dj ? `<div class="rem-list">${cards}${dj}</div>` : card(null, `<div class="empty">${t('Nothing waiting for approval.')}</div>`)) + `<p class="muted small" style="margin-top:14px">${t('Discount limit')}: ${c.settings.discountLimitPct}% · ${t('change it in Settings.')}</p>`;
};
ACT.aprYes = id => { const a = byId('approvals', id); const r = aprRef(a); modal({ title: t('Approve') + ' ' + a.no, body: `<p style="margin:0"><b>${r[0]}</b></p><p class="muted small">${r[2] || ''}</p><p style="margin:0">${esc(aprSummary(a))}</p>` + F('reason', t('Note (optional)'), { full: 1 }), submit: t('Approve'), ok: t('Approved'), onSubmit: x => decideApproval(id, true, x.reason) }); };
ACT.aprNo = id => modal({ title: t('Reject') + ' ' + byId('approvals', id).no, body: F('reason', t('Reason'), { req: 1, full: 1 }), submit: t('Reject'), danger: 1, ok: t('Rejected'), onSubmit: x => decideApproval(id, false, x.reason) });
function dealApprovalBanner(d) {
  const a = (co().approvals || []).find(x => x.refId === d.id && x.status === 'pending');
  if (d.approval && d.approval.status === 'pending') return `<div class="banner warn"><div><b>${t('Waiting for manager approval')}</b> — ${esc(d.approval.reasons.map(reasonTxt).join('; '))}. ${t('The car cannot be booked or delivered until then.')}</div>${a && canDecide(a) ? btn(t('Approve'), 'aprYes', { id: a.id, cls: 'sm primary' }) + btn(t('Reject'), 'aprNo', { id: a.id, cls: 'sm danger' }) : ''}</div>`;
  if (d.approval && d.approval.status === 'rejected') return `<div class="banner bad"><div><b>${t('Price rejected')}</b> ${esc(d.approval.decidedBy || '')}${d.approval.reason ? ': ' + esc(d.approval.reason) : ''} — ${t('revise the deal to continue.')}</div></div>`;
  if (d.cancelPending && a) return `<div class="banner warn"><div><b>${t('Deposit refund waiting for approval')}</b> · ${money(a.amount)}</div>${canDecide(a) ? btn(t('Approve'), 'aprYes', { id: a.id, cls: 'sm primary' }) + btn(t('Reject'), 'aprNo', { id: a.id, cls: 'sm danger' }) : ''}</div>`;
  if (d.approval && d.approval.status === 'approved') return `<div class="banner good"><div>${t('Price approved by')} <b>${esc(d.approval.decidedBy)}</b></div></div>`;

}

  const next = (() => { const r = (c.fpRuns || []).slice().sort(); const l = r[r.length - 1]; return l ? monthOf(addMonths(l + '-01', 1)) : monthOf(addMonths(T, -1)); })();
  return ph(t('Floor-plan financing'), { eyebrow: t('Finance'), sub: esc(c.settings.floorplanLender) + ' · ' + c.settings.floorplanRate + '% ' + t('p.a.') + ' · ' + t('curtailment after') + ' ' + c.settings.curtailDays + ' ' + t('days'), actions: btn(t('Accrue interest'), 'fpAccrue', { arg: next, cls: 'primary' }) }) +
    `<div class="kpis">${kpi(t('Cars on floor plan'), open.length, money0(sum(open, f => f.principal)) + ' ' + t('principal'), true)}${kpi(t('Owing today'), money0(owing), t('principal + interest'))}${kpi(t('Interest accrued'), money0(sum(open, f => f.accrued)), '2500')}${kpi(t('Sold, not yet settled'), soldOpen.length, soldOpen.length ? t('settle now to stop interest') : '')}</div>` +
    tabs('fp', [['open', t('Open'), open.length], ['settled', t('Settled'), all.length - open.length]], tab) +
    card(null, table([{ h: t('Loan'), f: f => `<b>${f.no}</b><div class="muted small">${esc(f.lender)}</div>` }, { h: t('Vehicle'), f: f => `<a href="#" data-go="vehicle:${f.vehicleId}">${esc(vname(vehicle(f.vehicleId)))}</a> ${badge(vehicle(f.vehicleId).status)}` }, { h: t('Drawn'), f: f => fdate(f.start) },

      { h: tab === 'open' ? t('Owing today') : t('Settled'), cls: 'num', f: f => f.status === 'open' ? `<b>${money(fpStatus(f).owing)}</b>` : fdate(f.settledOn) }, { h: '', f: f => f.status === 'open' ? btn(t('Settle'), 'fpSettle', { id: f.id, cls: 'sm' + (vehicle(f.vehicleId).status === 'sold' ? ' primary' : '') }) : `<a href="#" data-go="journal:${f.jid}" class="small">${t('Journal')}</a>` }], tab === 'open' ? open : all.filter(f => f.status !== 'open'), { empty: t('No floor-plan loans. Choose "Floor-plan loan" when purchasing a car.') }), { flush: true });

ACT.fpAccrue = (_, m) => modal({ title: t('Accrue floor-plan interest'), body: F('month', t('Month'), { type: 'month', value: m, req: 1 }) + `<div class="muted small">${t('Posts interest for every open loan up to the month end: Dr floor-plan interest, Cr accrued expenses.')}</div>`, submit: t('Accrue'), ok: t('Interest accrued'), onSubmit: x => runFloorplanAccrual(x.month) });

REPORTS.branch = { g: 'Financial statements', title: 'Profit & loss by branch', desc: 'Revenue and costs for each showroom, workshop and rental desk.', run: () => {
  const dr = dateRange('bp', ytd(), today()); const b = branchPL(dr.from, dr.to); const c = co();
  const colName = k => k === '_' ? t('Head office') : nm(c.branches.find(x => x.id === k));

  const tot = (type, k) => sum(codes.filter(cd => acc(cd).type === type), cd => val(cd, k));
  const net = k => r2(tot('R', k) - tot('X', k));

    <tfoot><tr><td>${t('Net profit')}</td>${b.cols.map(k => `<td class="num ${net(k) < 0 ? 'neg' : ''}">${money0(net(k))}</td>`).join('')}<td class="num">${money0(sum(b.cols, net))}</td></tr></tfoot></table></div>`;
  return reportShell('branch', t('Profit & loss by branch'), dr.html, `<div class="kpis">${b.cols.map(k => kpi(esc(colName(k)), money0(net(k)), t('Revenue') + ' ' + money0(tot('R', k)), k === b.cols[0])).join('')}</div>` + card(null, html, { flush: true }) + `<p class="muted small">${t('Sales, rental and workshop lines follow the car or agreement to its branch; salaries, rent and other overheads show under head office.')}</p>`,
    [['Account', ...b.cols.map(colName), 'Total'], ...codes.map(cd => [cd + ' ' + accName(cd), ...b.cols.map(k => val(cd, k)), sum(b.cols, k => val(cd, k))])]);
} };
REPORTS.budget = { g: 'Financial statements', title: 'Budget vs actual', desc: 'Actual revenue and costs against the monthly budget, with variances.', run: () => {
  const y = today().slice(0, 4); const m1 = Number(UI.q.bvaFrom || 1), m2 = Number(UI.q.bvaTo || Number(today().slice(5, 7)));
  const rows = budgetVsActual(y, m1, Math.max(m1, m2)); const mo = Array.from({ length: 12 }, (_, i) => [String(i + 1), fmonth(y + '-' + pad(i + 1, 2))]);
  const tr2 = r => `<tr><td class="ind"><span class="mono">${r.code}</span> ${esc(r.name)}</td><td class="num">${money0(r.bud)}</td><td class="num">${money0(r.act)}</td><td class="num ${r.varc < 0 ? 'neg' : 'pos'}">${money0(r.varc)}</td><td class="num">${r.bud ? ((r.act / r.bud) * 100).toFixed(0) + '%' : '—'}</td><td style="min-width:120px"><div class="bar-mini ${r.varc < 0 ? '' : 'acc'}"><i style="width:${Math.min(100, r.bud ? r.act / r.bud * 100 : 0)}%"></i></div></td></tr>`;
  const R1 = rows.filter(r => r.type === 'R'), X1 = rows.filter(r => r.type === 'X');
  const tb = (arr, k) => sum(arr, r => r[k]);

  return reportShell('budget', t('Budget vs actual') + ' ' + y, `<label class="who"><span>${t('From')}</span><select data-filter="bvaFrom">${mo.map(([v, l]) => `<option value="${v}"${Number(v) === m1 ? ' selected' : ''}>${l}</option>`).join('')}</select></label><label class="who"><span>${t('To')}</span><select data-filter="bvaTo">${mo.map(([v, l]) => `<option value="${v}"${Number(v) === m2 ? ' selected' : ''}>${l}</option>`).join('')}</select></label><button class="btn sm" data-go="budgets">${t('Edit budget')}</button>`,
    `<div class="kpis">${kpi(t('Revenue vs budget'), money0(tb(R1, 'act')), t('budget') + ' ' + money0(tb(R1, 'bud')))}${kpi(t('Costs vs budget'), money0(tb(X1, 'act')), t('budget') + ' ' + money0(tb(X1, 'bud')))}${kpi(t('Profit vs budget'), money0(profitA), t('budget') + ' ' + money0(profitB), true)}</div>` +
    card(null, `<div class="tw"><table class="t"><thead><tr><th>${t('Account')}</th><th class="num">${t('Budget')}</th><th class="num">${t('Actual')}</th><th class="num">${t('Variance')}</th><th class="num">%</th><th></th></tr></thead><tbody><tr class="sub"><td colspan="6">${t('Revenue')}</td></tr>${R1.map(tr2).join('')}<tr class="sub"><td colspan="6">${t('Costs')}</td></tr>${X1.map(tr2).join('')}</tbody><tfoot><tr><td>${t('Net profit')}</td><td class="num">${money0(profitB)}</td><td class="num">${money0(profitA)}</td><td class="num ${profitA - profitB < 0 ? 'neg' : 'pos'}">${money0(profitA - profitB)}</td><td></td><td></td></tr></tfoot></table></div>`, { flush: true }) + `<p class="muted small">${t('Variance is favourable (green) when revenue beats budget or costs come in under it.')}</p>`,
    [['Account', 'Budget', 'Actual', 'Variance'], ...rows.map(r => [r.code + ' ' + r.name, r.bud, r.act, r.varc])]);
} };

let TOUR = null;
function tourRoot() { let r = document.getElementById('tour-root'); if (!r) { r = document.createElement('div'); r.id = 'tour-root'; document.body.appendChild(r); } return r; }
ACT.tourStart = () => {
  const admin = DB.users.find(u => u.role === 'admin'); if (admin) { SESSION.userId = admin.id; DB.sessionUser = admin.id; }
  const dana = DB.companies.find(c => /Dana/.test(c.name)); if (dana) DB.currentCompanyId = dana.id;
  closeModal(); TOUR = { i: 0 }; tourShow();
};
function tourEnd() { TOUR = null; tourRoot().innerHTML = ''; window.removeEventListener('resize', tourPlace); window.removeEventListener('scroll', tourPlace, true); }
function tourShow() {
  const st = TOUR_STEPS[TOUR.i]; const route = typeof st.r === 'function' ? st.r() : st.r;
  go(route);
  const ar = LANG === 'ar'; const [title, body] = ar ? st.ar : st.en; const n = TOUR_STEPS.length;
  tourRoot().innerHTML = `<div class="tour-ring" aria-hidden="true"></div><div class="tour-card" role="dialog" aria-modal="false" aria-labelledby="tour-t"><div class="tour-n">${ar ? 'جولة تعريفية' : 'Demo tour'} · <bdi>${TOUR.i + 1} / ${n}</bdi></div><h3 id="tour-t">${esc(title)}</h3><p>${esc(body)}</p>
    <div class="tour-bar"><button type="button" class="btn sm ghost" data-tour="end">${ar ? 'إنهاء' : 'End tour'}</button><span class="spacer"></span>${TOUR.i ? `<button type="button" class="btn sm" data-tour="prev">${ar ? 'السابق' : 'Back'}</button>` : ''}<button type="button" class="btn sm primary" data-tour="next">${TOUR.i === n - 1 ? (ar ? 'إنهاء الجولة' : 'Finish') : (ar ? 'التالي' : 'Next')}</button></div>
    <div class="tour-dots">${TOUR_STEPS.map((_, i) => `<i class="${i === TOUR.i ? 'on' : ''}"></i>`).join('')}</div></div>`;
  window.addEventListener('resize', tourPlace); window.addEventListener('scroll', tourPlace, true);
  const el = tourTarget(); if (el) el.scrollIntoView({ block: 'center', behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
  requestAnimationFrame(() => { tourPlace(); const b = document.querySelector('[data-tour=next]'); if (b) b.focus({ preventScroll: true }); });
}
function tourTarget() { const st = TOUR_STEPS[TOUR.i]; for (const s of st.s.split(',')) { const el = document.querySelector(s.trim()); if (el && el.getBoundingClientRect().width) return el; } return document.querySelector('#view h1'); }
function tourPlace() {
  if (!TOUR) return; const ring = document.querySelector('.tour-ring'), cardEl = document.querySelector('.tour-card'); if (!ring || !cardEl) return;
  const el = tourTarget(); const vw = window.innerWidth, vh = window.innerHeight;
  if (!el) { ring.style.display = 'none'; return; } ring.style.display = '';
  const r = el.getBoundingClientRect(); const pad = 6;
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad), h = Math.min(r.height + pad * 2, vh - top - 4), w = Math.min(r.width + pad * 2, vw - left - 4);
  Object.assign(ring.style, { top: top + 'px', left: left + 'px', width: w + 'px', height: Math.max(h, 24) + 'px' });
  if (vw < 640) { Object.assign(cardEl.style, { left: '12px', right: '12px', top: 'auto', bottom: '12px', width: 'auto' }); return; }
  const cw = Math.min(380, vw - 32); const ch = cardEl.offsetHeight;
  let ct = top + h + 12; if (ct + ch > vh - 12) ct = top - ch - 12; if (ct < 12) ct = Math.max(12, vh - ch - 12);
  let cl = LANG === 'ar' ? left + w - cw : left; cl = Math.min(Math.max(12, cl), vw - cw - 12);
  Object.assign(cardEl.style, { top: ct + 'px', left: cl + 'px', right: 'auto', bottom: 'auto', width: cw + 'px' });
}
document.addEventListener('click', e => {
  if (TOUR && e.target.closest('[data-act="toggleLang"]')) { setTimeout(tourShow, 0); return; }
  const b = e.target.closest('[data-tour]'); if (!b || !TOUR) return; e.preventDefault(); e.stopPropagation();
  const a = b.dataset.tour; if (a === 'end') return tourEnd();
  if (a === 'next') { if (TOUR.i >= TOUR_STEPS.length - 1) { tourEnd(); go('dash'); return; } TOUR.i++; }
  if (a === 'prev') TOUR.i = Math.max(0, TOUR.i - 1);
  tourShow();
}, true);
document.addEventListener('keydown', e => {
  if (!TOUR || MODAL) return;
  if (e.key === 'Escape') tourEnd();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const fwd = (e.key === 'ArrowRight') !== (LANG === 'ar'); if (fwd && TOUR.i < TOUR_STEPS.length - 1) TOUR.i++; else if (!fwd && TOUR.i > 0) TOUR.i--; else return; e.preventDefault(); tourShow(); }
});

   ========================================================================== */
'use strict';
function boot() {
  DB = loadDB();
  if (!DB) { seedDemo(); }
  LANG = DB.lang || 'en';
  SESSION.userId = DB.sessionUser && DB.users.find(u => u.id === DB.sessionUser) ? DB.sessionUser : DB.users[0].id;
  if (!DB.companies.find(c => c.id === DB.currentCompanyId)) DB.currentCompanyId = DB.companies[0].id;
  const h = (location.hash || '').slice(1); if (h && VIEWS[h] && !h.includes(':')) ROUTE = h;
  DB.companies.forEach(migrateCompany); injectPrintCSS();
  bindEvents(); bindDocEvents(); bindSearchKeys(); render(); saveDB();
  seedDemoDocs();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
