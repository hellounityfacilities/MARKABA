<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markaba Showroom Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a fixed graphite rail on the leading edge, a fluid work surface; tables and documents are the primary objects.
   Signal-amber is the one accent (active nav, focus, highlights); petrol blue carries primary actions. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #16212b; --muted: #5a6876; --line: #d6dde4; --line-2: #e6eaee;
  --rail: #16202a; --rail-ink: #cdd6de; --rail-muted: #7d8c9a; --rail-hover: #1f2c38; --rail-active: #26384a;
  --accent: #c46b00; --accent-ink: #8e4c00; --accent-soft: #fbeedb;
  --primary: #1f4e6b; --primary-ink: #ffffff; --primary-hover: #183f58;
  --good: #1b7449; --good-soft: #e0f1e8; --warn: #9a5c00; --warn-soft: #faedd5; --bad: #b0271f; --bad-soft: #fae3e1; --info: #285b85; --info-soft: #e2edf7;
  --c1: #1f4e6b; --c2: #d08419; --c3: #2e8b7e; --c4: #8a7fb8;
  --plate-bg: #fbfbf8; --plate-ink: #111; --plate-band: #8a1538;
  --shadow: 0 1px 2px rgba(22,33,43,.06), 0 6px 20px rgba(22,33,43,.06);
  --f-display: 'Saira Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #151d25; --surface-2: #1a242e; --ink: #e4e9ee; --muted: #93a2b0; --line: #2a3643; --line-2: #222d38;
  --rail: #0a0f14; --rail-ink: #c3ccd5; --rail-muted: #6f7f8e; --rail-hover: #131b23; --rail-active: #1c2a37;
  --accent: #f0a23a; --accent-ink: #f5b65c; --accent-soft: #3a2a14;
  --primary: #3f86b3; --primary-ink: #ffffff; --primary-hover: #4b93c1;
  --good: #4cc08a; --good-soft: #15302a; --warn: #e9ad4d; --warn-soft: #362a14; --bad: #f07a70; --bad-soft: #3a1c1c; --info: #74abd8; --info-soft: #172a3a;
  --c1: #4f94c2; --c2: #e7a33f; --c3: #4bb3a4; --c4: #a79ad6;
  --plate-bg: #f1f1ec; --plate-ink: #111; --plate-band: #9c2447;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #151d25; --surface-2: #1a242e; --ink: #e4e9ee; --muted: #93a2b0; --line: #2a3643; --line-2: #222d38;
  --rail: #0a0f14; --rail-ink: #c3ccd5; --rail-muted: #6f7f8e; --rail-hover: #131b23; --rail-active: #1c2a37;
  --accent: #f0a23a; --accent-ink: #f5b65c; --accent-soft: #3a2a14;
  --primary: #3f86b3; --primary-ink: #ffffff; --primary-hover: #4b93c1;
  --good: #4cc08a; --good-soft: #15302a; --warn: #e9ad4d; --warn-soft: #362a14; --bad: #f07a70; --bad-soft: #3a1c1c; --info: #74abd8; --info-soft: #172a3a;
  --c1: #4f94c2; --c2: #e7a33f; --c3: #4bb3a4; --c4: #a79ad6;
  --plate-bg: #f1f1ec; --plate-ink: #111; --plate-band: #9c2447;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
:lang(ar) h1, :lang(ar) h2, :lang(ar) h3 { font-family: var(--f-body); letter-spacing: 0; }
.num, td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* numbers keep left-to-right order inside Arabic pages (minus signs, ratios, units) */
td.num, span.num, b.num, .kpi .v, .summary div > span:last-child, .doc .totals div > span:last-child { direction: ltr; unicode-bidi: isolate; }
[dir=rtl] td.num, [dir=rtl] th.num { text-align: left; }
[dir=rtl] .kpi .v { text-align: right; }
.mono { font-family: var(--f-mono); font-size: .88em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--rail); color: var(--rail-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; padding-block: 18px 24px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 18px 16px; border-bottom: 1px solid var(--rail-active); margin-bottom: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #16202a; font: 700 17px var(--f-display); flex: none; }
.brand-name { font: 700 19px var(--f-display); letter-spacing: .08em; color: #fff; line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--rail-muted); letter-spacing: .04em; }
.nav-group { padding: 10px 10px 2px; }
.nav-group > span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--rail-muted); padding: 6px 10px; }
:lang(ar) .nav-group > span { letter-spacing: 0; font-size: 12px; }
.nav-group a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--rail-ink); text-decoration: none; font-size: 13.5px; border-inline-start: 3px solid transparent; }
.nav-group a:hover { background: var(--rail-hover); }
.nav-group a.on { background: var(--rail-active); color: #fff; border-inline-start-color: var(--accent); }
.nav-count { font-size: 11px; background: var(--rail-active); color: var(--rail-ink); border-radius: 10px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.nav-group a.on .nav-count { background: var(--accent); color: #16202a; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .spacer { flex: 1; }
.top select { max-width: 230px; }
.menu-btn { display: none; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
#view { padding: 22px 24px 60px; max-width: 1480px; width: 100%; }

/* page header */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.ph h1 { font-size: 26px; line-height: 1.15; }
.ph .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-ink); font-weight: 600; margin-bottom: 2px; }
:lang(ar) .ph .eyebrow { letter-spacing: 0; }
.ph .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 7px 13px; cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #1a1206; }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--primary); }
textarea { min-height: 64px; resize: vertical; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; font-weight: 500; color: var(--muted); }
.fld .hint { font-size: 11.5px; color: var(--muted); }
.fld.full { grid-column: 1 / -1; }
.grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input, .filters select { width: auto; min-width: 150px; }
.filters input[type=search] { min-width: 220px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button .nav-count { background: var(--surface-2); color: var(--muted); margin-inline-start: 6px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; margin: 0; min-width: 0; }
legend { font-weight: 600; font-size: 13px; padding: 0 6px; }
details.box { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
details.box summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.box[open] summary { margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer; border-inline-end: 1px solid var(--line); font-size: 13px; }
.seg label:last-child { border-inline-end: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg label:has(input:checked) { background: var(--primary); color: var(--primary-ink); }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card > .hd h2 { font-size: 16px; }
.card > .bd { padding: 14px 16px; }
.card > .bd.flush { padding: 0; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.cols.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
:lang(ar) .kpi .l { letter-spacing: 0; font-size: 12.5px; }
.kpi .v { font: 600 24px/1.2 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.lead { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--surface)) padding-box; box-shadow: inset 0 3px 0 var(--accent); }
.dl { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 6px 14px; margin: 0; }
.dl dt { color: var(--muted); font-size: 12.5px; }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: start; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; }
:lang(ar) table.t th { letter-spacing: 0; font-size: 12px; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; background: var(--surface-2); }
table.t tr.sub td { background: var(--surface-2); font-weight: 600; }
table.t td.ind { padding-inline-start: 28px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.neg { color: var(--bad); }
.pos { color: var(--good); }

/* badges & domain chips */
.b { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-2); }
.b::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.b.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.b.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.b.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.b.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.b.acc { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.plate { display: inline-flex; align-items: stretch; border: 1.5px solid #222; border-radius: 4px; background: var(--plate-bg); color: var(--plate-ink); font: 600 12.5px/1 var(--f-mono); overflow: hidden; vertical-align: middle; direction: ltr; }
.plate i { font-style: normal; background: var(--plate-band); color: #fff; font: 700 7.5px/1 var(--f-body); letter-spacing: .06em; padding: 3px 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1px; }
.plate b { padding: 3px 7px; letter-spacing: .06em; font-weight: 600; }
.fuel { display: inline-flex; gap: 2px; vertical-align: middle; direction: ltr; }
.fuel i { width: 6px; height: 12px; border-radius: 1.5px; background: var(--line); }
.fuel i.on { background: var(--good); }
.fuel.low i.on { background: var(--warn); }
.vin { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); direction: ltr; unicode-bidi: embed; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); vertical-align: middle; margin-inline-end: 5px; }

/* stepper */
.steps { display: flex; gap: 0; margin: 4px 0 16px; flex-wrap: wrap; }
.steps span { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.steps span:first-child { border-start-start-radius: 20px; border-end-start-radius: 20px; }
.steps span:last-child { border-start-end-radius: 20px; border-end-end-radius: 20px; }
.steps span + span { border-inline-start: 0; }
.steps span.done { color: var(--good); }
.steps span.cur { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.steps span.x { background: var(--bad-soft); color: var(--bad); }

/* rental board */
.fleet-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fcard .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fcard h3 { font-size: 15.5px; }
.fcard .meta { font-size: 12.5px; color: var(--muted); }
.fcard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.fcard.st-on-rent { box-shadow: inset 3px 0 0 var(--info); }
.fcard.st-maintenance { box-shadow: inset 3px 0 0 var(--warn); }
.fcard.st-available { box-shadow: inset 3px 0 0 var(--good); }
[dir=rtl] .fcard.st-on-rent { box-shadow: inset -3px 0 0 var(--info); }
[dir=rtl] .fcard.st-maintenance { box-shadow: inset -3px 0 0 var(--warn); }
[dir=rtl] .fcard.st-available { box-shadow: inset -3px 0 0 var(--good); }
.tl { border-collapse: separate; border-spacing: 2px; font-size: 12px; width: 100%; }
.tl th { font-weight: 500; color: var(--muted); padding: 2px; text-align: center; white-space: nowrap; }
.tl th.today { color: var(--accent-ink); font-weight: 700; }
.tl td { height: 26px; padding: 0; border-radius: 3px; background: var(--surface-2); min-width: 26px; }
.tl td.lbl { background: none; padding-inline-end: 10px; white-space: nowrap; font-size: 12.5px; height: auto; }
.tl td.rent { background: var(--info); }
.tl td.late { background: var(--bad); }
.tl td.res { background: var(--accent); opacity: .75; }
.tl td.svc { background: var(--warn); opacity: .6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 5px; }

/* alerts */
.alerts { list-style: none; margin: 0; padding: 0; }
.alerts li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.alerts li:hover { background: var(--surface-2); }
.alerts li:last-child { border-bottom: 0; }
.sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); }

/* documents (invoice, agreement) */
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 32px; max-width: 860px; }
.doc-hd { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.doc-hd .co { font: 700 20px var(--f-display); }
.doc-hd .ttl { text-align: end; }
.doc-hd .ttl h2 { font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
:lang(ar) .doc-hd .ttl h2 { letter-spacing: 0; }
.doc .totals { margin-inline-start: auto; width: min(340px, 100%); margin-top: 10px; }
.doc .totals div { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
.doc .totals .grand { border-top: 2px solid var(--ink); font-weight: 700; font-size: 16px; margin-top: 4px; padding-top: 8px; }
.sig { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; font-size: 12px; color: var(--muted); }
.sig div { border-top: 1px solid var(--line); padding-top: 6px; }

.logo-prev { width: 150px; height: 70px; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; background: #fff; overflow: hidden; }
.logo-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* reminders */
.rem-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rem header, .rem footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.rem footer { justify-content: flex-start; margin-top: auto; }
.rem-msg { background: var(--surface-2); border-radius: 10px; border-start-start-radius: 2px; padding: 9px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.rem-msg[dir=rtl] { font-family: 'IBM Plex Sans Arabic', var(--f-body); text-align: right; }
.sm-seg label { padding: 3px 9px; font-size: 12px; }
.msg-log { border-bottom: 1px solid var(--line-2); padding: 6px 0; } .msg-log:last-child { border-bottom: 0; }

/* condition check */
.insp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
.insp-car { display: flex; flex-direction: column; align-items: center; gap: 8px; }
svg.car { height: auto; max-width: 100%; }
svg.car .z rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; transition: fill .12s; }
svg.car.interactive .z { cursor: pointer; outline: none; }
svg.car.interactive .z:hover rect, svg.car.interactive .z:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
svg.car .z.old rect { fill: var(--warn-soft); stroke: var(--warn); }
svg.car .z.new rect { fill: var(--bad-soft); stroke: var(--bad); }
svg.car text { font: 700 11px var(--f-mono); fill: var(--ink); pointer-events: none; }
svg.car .car-front { font: 600 8px var(--f-body); fill: var(--muted); letter-spacing: .1em; }
.marks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.marks li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.marks li input { flex: 1; min-width: 0; padding: 4px 8px; font-size: 12.5px; }
.mk { flex: none; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font: 700 11px var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); }
.mk.old { background: var(--warn-soft); border-color: var(--warn); } .mk.new { background: var(--bad-soft); border-color: var(--bad); }
.sig-wrap { display: flex; flex-direction: column; gap: 6px; }
#sig { width: 100%; max-width: 560px; aspect-ratio: 560 / 150; height: auto; background: #fff; border: 1px dashed var(--line); border-radius: 6px; touch-action: none; cursor: crosshair; }
.sig-acts { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.insp-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.insp-side { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.sig-img { max-width: 100%; height: 34px; object-fit: contain; background: #fff; border-radius: 4px; }
.legend i { vertical-align: -2px; }
@media (max-width: 620px) { .insp { grid-template-columns: minmax(0, 1fr); } }

/* global search */
.search-btn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 340px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; color: var(--muted); cursor: pointer; font-size: 13px; }
.search-btn:hover { border-color: var(--muted); }
.search-btn .sb-txt { flex: 1; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-btn kbd, .sr-foot kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.sr-box { background: var(--surface); border-radius: 10px; width: min(680px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 78vh; overflow: hidden; }
.sr-box input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 16px; }
.sr-box input:focus { box-shadow: none; border-bottom-color: var(--accent); }
.sr-list { overflow-y: auto; padding: 6px; }
.sr-g { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 10px 10px 4px; }
:lang(ar) .sr-g { letter-spacing: 0; font-size: 12px; }
.sr-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 10px; width: 100%; text-align: start; background: none; border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; color: var(--ink); }
.sr-i .b { grid-row: 1 / 3; grid-column: 2; align-self: center; }
.sr-i.on, .sr-i:hover { background: var(--accent-soft); }
.sr-t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-foot { border-top: 1px solid var(--line); padding: 8px 14px; }
@media (max-width: 820px) { .search-btn { flex: 0 0 auto; } .search-btn .sb-txt, .search-btn kbd { display: none; } }

/* supporting documents */
.docs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.docs li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface-2); min-width: 0; }
.doc-meta { flex: 1; min-width: 0; }
.doc-meta .linkish { overflow-wrap: anywhere; text-align: start; }
.doc-ic { flex: none; width: 38px; height: 44px; border-radius: 4px; display: grid; place-items: center; font: 700 10px var(--f-mono); letter-spacing: .04em; color: #fff; background: var(--muted); }
.doc-ic.k-pdf { background: var(--bad); } .doc-ic.k-img { background: var(--info); } .doc-ic.k-xls { background: var(--good); } .doc-ic.k-doc { background: var(--primary); }
.linkish { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.drop { display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px 12px; cursor: pointer; color: var(--muted); font-size: 12.5px; position: relative; }
.drop b { color: var(--ink); font-size: 13.5px; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.clip { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* modal & toast */
.scrim { position: fixed; inset: 0; background: rgba(10,15,20,.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.dlg { background: var(--surface); border-radius: 10px; width: min(640px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.dlg.wide { width: min(980px, 100%); }
.dlg > header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg > header h2 { font-size: 18px; }
.dlg .x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.dlg-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.dlg > footer { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dlg .err { color: var(--bad); font-size: 13px; margin-inline-end: auto; }
.summary { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.summary div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.summary .grand { font-weight: 700; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
.lines { width: 100%; border-collapse: collapse; }
.lines th { font-size: 11.5px; color: var(--muted); text-align: start; font-weight: 500; padding: 0 4px 4px; }
.lines td { padding: 3px 4px; vertical-align: middle; }
.lines td.del { width: 30px; }
#toast-root { position: fixed; inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13.5px; max-width: 360px; animation: tin .18s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .side { transition: none !important; } }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.chart .grid-l { stroke: var(--line-2); stroke-width: 1; }
.bar-mini { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.bar-mini > i { display: block; height: 100%; background: var(--primary); }
.bar-mini.acc > i { background: var(--accent); }

/* report launcher */
.rgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; text-align: start; display: flex; flex-direction: column; gap: 4px; }
.rcard:hover, .rcard.on { border-color: var(--accent); }
.rcard.on { box-shadow: inset 0 3px 0 var(--accent); }
.rcard b { font-size: 14.5px; }
.rcard span { font-size: 12.5px; color: var(--muted); }
.rgroup { font: 600 13px var(--f-body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 18px 0 8px; }
:lang(ar) .rgroup { letter-spacing: 0; }

/* responsive */
@media (max-width: 980px) {
  .cols, .cols.even { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 260px; z-index: 60; transform: translateX(-100%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  [dir=rtl] .side { transform: translateX(100%); }
  body.nav-open .side { transform: none; }
  body.nav-open::after { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; }
  .menu-btn { display: inline-flex; }
  .top { padding: 8px 16px; }
  .top select { max-width: 150px; }
  #view { padding: 16px 16px 60px; }
  .grid.g2, .grid.g3 { grid-template-columns: minmax(0, 1fr); }
  .doc { padding: 18px 16px; }
  .ph h1 { font-size: 22px; }
  .filters input, .filters select, .filters input[type=search] { min-width: 0; flex: 1 1 140px; }
}
@media print {
  .side, .top, .ph .actions, .no-print { display: none !important; }
  .app { display: block; } #view { padding: 0; }
  .doc { border: 0; max-width: none; }
}

/* ---------- batch 4: approvals, appointments, budgets, tour ---------- */
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); margin: 0 0 16px; border: 1px solid; font-size: 13.5px; }
.banner > div { flex: 1 1 260px; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.banner.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; min-height: 180px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day.off { background: var(--surface-2); }
.day-h { font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line-2); padding-bottom: 4px; }
.day-h b { color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.apt { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 1px; cursor: pointer; background: var(--info-soft); border-inline-start: 3px solid var(--info); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere; }
.apt:hover { filter: brightness(.97); } .apt:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.apt.st-arrived { background: var(--good-soft); border-color: var(--good); }
.apt.st-no-show { background: var(--bad-soft); border-color: var(--bad); opacity: .8; }
.apt .b { align-self: flex-start; margin-top: 2px; }
@media (max-width: 900px) { .week { grid-template-columns: 1fr; } .day { min-height: 0; } .day.off:not(:has(.apt)) { display: none; } }
table.budget td { padding: 3px 4px; } table.budget td:first-child { padding-inline-start: 12px; }
table.budget input.bud { width: 78px; padding: 4px 6px; font: 12.5px var(--f-mono); text-align: end; direction: ltr; border: 1px solid var(--line-2); border-radius: 5px; background: var(--surface); color: var(--ink); }
table.budget input.bud:focus { border-color: var(--primary); outline: none; }
.tour-btn { border-color: var(--accent); color: var(--accent-ink); }
#tour-root .tour-ring { position: fixed; z-index: 90; border-radius: 10px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 9999px rgba(10, 16, 22, .5); pointer-events: none; transition: all .25s ease; }
#tour-root .tour-card { position: fixed; z-index: 91; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 16px 18px 12px; box-shadow: 0 12px 40px rgba(0,0,0,.3); border-top: 4px solid var(--accent); }
.tour-card h3 { margin: 4px 0 6px; font: 600 19px/1.25 var(--f-display); }
:lang(ar) .tour-card h3 { font-family: 'IBM Plex Sans Arabic', var(--f-body); }
.tour-card p { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.tour-n { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); font-weight: 600; }
:lang(ar) .tour-n { letter-spacing: 0; }
.tour-bar { display: flex; gap: 6px; align-items: center; } .tour-bar .spacer { flex: 1; }
.tour-dots { display: flex; gap: 4px; justify-content: center; margin-top: 10px; } .tour-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); } .tour-dots i.on { background: var(--accent); width: 16px; border-radius: 3px; }
@media (max-width: 720px) { .tour-btn .tb-txt { display: none; } }
@media print { #tour-root { display: none; } }
@media (max-width: 1480px) { .top .who > span.muted { display: none; } .top select { max-width: 210px; } }

<script>
/* ==========================================================================
   MARKABA — core: state, storage, helpers, chart of accounts, ledger engine
   DOM-free so the same code runs in the browser and in the Node test suite.
   ========================================================================== */
'use strict';
const APP = { name: 'Markaba', version: '1.0.0', storeKey: 'markaba.v1' };

let DB = null;          // whole application state (all companies)
let SESSION = { userId: null };

/* ---------- small helpers ---------- */
const r2 = x => Math.round((Number(x) || 0) * 100) / 100;
const cents = x => Math.round((Number(x) || 0) * 100);
const sum = (arr, f) => r2(arr.reduce((s, x) => s + (f ? (Number(f(x)) || 0) : (Number(x) || 0)), 0));
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function pad(n, w) { return String(n).padStart(w, '0'); }
function isoLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2); }
function today() { return isoLocal(new Date()); }
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return isoLocal(d); }
function addMonths(s, n) {
  const d = parseD(s); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return isoLocal(d);
}
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function monthEnd(ym) { const [y, m] = ym.split('-').map(Number); return isoLocal(new Date(y, m, 0)); }
function monthOf(s) { return s.slice(0, 7); }
const D = off => addDays(today(), off);   // relative demo dates

function fail(msg) { const e = new Error(msg); e.userError = true; throw e; }
function tr(s) { return (typeof t === 'function') ? t(s) : s; }

/* ---------- company access ---------- */
function co() { return DB.companies.find(c => c.id === DB.currentCompanyId); }
function user() { return DB.users.find(u => u.id === SESSION.userId) || DB.users[0]; }
function nextNo(prefix) {
  const c = co(); c.seq[prefix] = (c.seq[prefix] || 0) + 1;
  return prefix + '-' + pad(c.seq[prefix], 5);
}
function byId(coll, id) { return (co()[coll] || []).find(x => x.id === id); }
function party(id) { return byId('parties', id); }
function vehicle(id) { return byId('vehicles', id); }
function employee(id) { return byId('employees', id); }
function item(id) { return byId('items', id); }
function audit(action, ref) {
  const c = co(); if (!c) return;
  c.audit.unshift({ ts: new Date().toISOString(), user: user() ? user().name : 'system', action, ref: ref || '' });
  if (c.audit.length > 1500) c.audit.length = 1500;
}

/* ---------- roles ---------- */
const ROLES = {
  admin:      { label: 'Administrator', areas: ['*'] },
  manager:    { label: 'Showroom manager', areas: ['dash', 'sales', 'stock', 'rental', 'workshop', 'parts', 'reports', 'customers'] },
  sales:      { label: 'Sales executive', areas: ['dash', 'sales', 'stock', 'customers'] },
  rental:     { label: 'Rental agent', areas: ['dash', 'rental', 'stock', 'customers'] },
  service:    { label: 'Service advisor', areas: ['dash', 'workshop', 'parts', 'customers'] },
  accountant: { label: 'Accountant', areas: ['dash', 'finance', 'reports', 'customers', 'stock', 'payroll'] }
};
function can(area) { const u = user(); if (!u) return false; const a = ROLES[u.role].areas; return a.includes('*') || a.includes(area); }
function isManager() { const u = user(); return u && (u.role === 'admin' || u.role === 'manager'); }

/* ---------- chart of accounts (EN / AR) ---------- */
// type: A asset, L liability, E equity, R revenue, X expense. ctl: control account needing a party.
const COA_SEED = [

  ['1030', 'Bank – QNB current', 'البنك – QNB جاري', 'A', { cash: 1, bank: 1 }],
  ['1040', 'Bank – CBQ current', 'البنك – التجاري جاري', 'A', { cash: 1, bank: 1 }],
  ['1100', 'Receivables – customers', 'ذمم العملاء', 'A', { ctl: 'customer' }],

  ['1150', 'Advances to suppliers', 'دفعات مقدمة للموردين', 'A', {}],
  ['1160', 'Post-dated cheques on hand', 'شيكات آجلة برسم التحصيل', 'A', {}],
  ['1170', 'Staff advances', 'سلف الموظفين', 'A', {}],
  ['1180', 'Input tax recoverable', 'ضريبة المدخلات القابلة للاسترداد', 'A', {}],
  ['1300', 'Vehicle stock – new', 'مخزون السيارات الجديدة', 'A', {}],
  ['1310', 'Vehicle stock – used', 'مخزون السيارات المستعملة', 'A', {}],
  ['1320', 'Vehicles in transit – landed costs', 'سيارات بالطريق – تكاليف الشحن', 'A', {}],
  ['1330', 'Parts & accessories stock', 'مخزون قطع الغيار والإكسسوارات', 'A', {}],
  ['1400', 'Prepaid expenses', 'مصروفات مدفوعة مقدماً', 'A', {}],
  ['1500', 'Rental fleet – cost', 'أسطول التأجير – التكلفة', 'A', {}],
  ['1510', 'Rental fleet – accumulated depreciation', 'مجمع إهلاك أسطول التأجير', 'A', { contra: 1 }],

  ['2210', 'Rental security deposits', 'تأمينات التأجير المستردة', 'L', { ctl: 'customer' }],

  ['2320', 'End-of-service benefits provision', 'مخصص مكافأة نهاية الخدمة', 'L', {}],
  ['2400', 'Output tax payable', 'ضريبة المخرجات المستحقة', 'L', {}],
  ['2500', 'Accrued expenses', 'مصروفات مستحقة', 'L', {}],
  ['2600', 'Floor-plan financing loan', 'قرض تمويل المخزون', 'L', {}],
  ['3100', 'Share capital', 'رأس المال', 'E', {}],
  ['3200', 'Retained earnings', 'الأرباح المحتجزة', 'E', {}],
  ['3300', 'Partners current account', 'جاري الشركاء', 'E', {}],
  ['3900', 'Opening balance equity', 'حقوق ملكية الأرصدة الافتتاحية', 'E', {}],
  ['4100', 'New vehicle sales', 'مبيعات السيارات الجديدة', 'R', {}],

/* ---------- ledger engine ---------- */
/* Invariants enforced on every posting:
   1. at least two lines   2. each line one-sided and positive   3. debits = credits (to the fils)
   4. accounts exist and are active   5. control accounts carry a party of the right kind
   6. date is after the period lock   7. journals are append-only (corrections by reversal) */
function checkJournal(date, lines) {   // the posting rules, usable as a dry run (draft submission)
  const c = co();
  if (!date) fail(tr('A posting date is required.'));
  if (c.settings.lockDate && date <= c.settings.lockDate) fail(tr('This date is in a locked period.') + ' (' + c.settings.lockDate + ')');
  const clean = [];
  for (const l of lines) {
    let dr = r2(l.dr), cr = r2(l.cr);
    if (dr < 0) { cr = r2(cr - dr); dr = 0; }
    if (cr < 0) { dr = r2(dr - cr); cr = 0; }
    if (dr && cr) { const n = r2(dr - cr); dr = n > 0 ? n : 0; cr = n < 0 ? -n : 0; }
    if (!dr && !cr) continue;
    const a = acc(l.acc);
    if (!a || !a.active) fail(tr('Unknown or inactive account') + ': ' + l.acc);
    if (a.ctl) {
      const p = party(l.party);
      if (!p) fail(tr('A party is required on control account') + ' ' + a.code);
      if (!(PARTY_ACCS[p.type] || []).includes(a.code)) fail(tr('Party type does not match account') + ' ' + a.code);
    }
    clean.push({ acc: l.acc, dr, cr, party: l.party || null, vehicle: l.vehicle || null, memo: l.memo || '' });
  }
  if (clean.length < 2) fail(tr('A journal needs at least two lines.'));
  const d = clean.reduce((s, l) => s + cents(l.dr), 0), k = clean.reduce((s, l) => s + cents(l.cr), 0);
  if (d !== k) fail(tr('Journal does not balance') + ': ' + (d / 100).toFixed(2) + ' / ' + (k / 100).toFixed(2));
  return clean;
}
function post({ date, memo, src, lines }) {
  const c = co(); const clean = checkJournal(date, lines);
  const j = { id: uid(), no: nextNo('JV'), date, memo: memo || '', src: src || { type: 'manual' }, lines: clean, by: user() ? user().name : 'system', ts: new Date().toISOString() };
  c.journals.push(j);
  return j;
}
function reverseJournal(jid, date, memo) {
  const c = co(); const j = c.journals.find(x => x.id === jid);
  if (!j) fail('Journal not found');
  if (j.reversedBy) fail(tr('This journal is already reversed.'));
  const r = post({ date, memo: memo || (tr('Reversal of') + ' ' + j.no), src: { type: 'reversal', id: j.id, no: j.no },
    lines: j.lines.map(l => ({ ...l, dr: l.cr, cr: l.dr })) });
  j.reversedBy = r.id; r.reverses = j.id;
  return r;
}
function journal(id) { return co().journals.find(j => j.id === id); }

/* balances: positive = normal side (debit for A/X, credit for L/E/R) */
function accBalance(code, opt) {
  opt = opt || {}; const a = acc(code); let b = 0;
  for (const j of co().journals) {
    if (opt.to && j.date > opt.to) continue;
    if (opt.from && j.date < opt.from) continue;
    for (const l of j.lines) {
      if (l.acc !== code) continue;
      if (opt.party && l.party !== opt.party) continue;
      if (opt.vehicle && l.vehicle !== opt.vehicle) continue;
      b += cents(l.dr) - cents(l.cr);
    }
  }
  b = b / 100;
  return (a && (a.type === 'A' || a.type === 'X')) ? r2(b) : r2(-b);
}
function trialBalance(to) {
  const rows = co().accounts.map(a => {
    let d = 0, k = 0;
    for (const j of co().journals) { if (to && j.date > to) continue; for (const l of j.lines) if (l.acc === a.code) { d += cents(l.dr); k += cents(l.cr); } }
    const net = d - k;
    return { code: a.code, name: accName(a.code), type: a.type, dr: net > 0 ? net / 100 : 0, cr: net < 0 ? -net / 100 : 0 };
  }).filter(r => r.dr || r.cr);
  return { rows, dr: sum(rows, r => r.dr), cr: sum(rows, r => r.cr) };
}
function profitAndLoss(from, to) {
  const lines = co().accounts.filter(a => a.type === 'R' || a.type === 'X').map(a => ({ code: a.code, name: accName(a.code), type: a.type, amt: accBalance(a.code, { from, to }) })).filter(r => r.amt);
  const rev = lines.filter(l => l.type === 'R'); const exp = lines.filter(l => l.type === 'X');
  const cogsCodes = ['5100', '5110', '5200'];
  const cogs = exp.filter(l => cogsCodes.includes(l.code)); const opex = exp.filter(l => !cogsCodes.includes(l.code));
  const totRev = sum(rev, l => l.amt), totCogs = sum(cogs, l => l.amt), totOpex = sum(opex, l => l.amt);
  return { rev, cogs, opex, totRev, totCogs, gross: r2(totRev - totCogs), totOpex, net: r2(totRev - totCogs - totOpex) };
}
function balanceSheet(to) {
  const mk = t => co().accounts.filter(a => a.type === t).map(a => ({ code: a.code, name: accName(a.code), amt: accBalance(a.code, { to }) })).filter(r => r.amt);
  const assets = mk('A'), liab = mk('L'), eq = mk('E');
  const earnings = profitAndLoss(null, to).net;   // unclosed P&L to date
  const totA = sum(assets, r => r.amt), totL = sum(liab, r => r.amt), totE = r2(sum(eq, r => r.amt) + earnings);
  return { assets, liab, eq, earnings, totA, totL, totE, diff: r2(totA - totL - totE) };
}

/* ---------- depreciation (fleet + furniture & equipment) ---------- */
function runDepreciation(ym) {
  const c = co(); if (c.deprRuns.find(r => r.month === ym)) fail(tr('Depreciation for this month has already been run.'));
  const date = monthEnd(ym); const lines = []; const detail = [];
  for (const v of c.vehicles) {
    if (v.purpose !== 'fleet' || !v.fleet || v.fleet.start > date) continue;
    const f = v.fleet; const base = r2(f.cost - f.residual); const left = r2(base - f.accDep); if (left <= 0) continue;
    const amt = Math.min(r2(base / f.lifeMonths), left); if (amt <= 0) continue;
    lines.push({ acc: '5310', dr: amt, vehicle: v.id }, { acc: '1510', cr: amt, vehicle: v.id }); detail.push({ ref: v.stockNo, amt, kind: 'fleet', id: v.id });
  }
  for (const a of c.assets) {
    if (a.date > date) continue; const left = r2(a.cost - a.accDep); if (left <= 0) continue;
    const amt = Math.min(r2(a.cost / a.lifeMonths), left);
    lines.push({ acc: '6250', dr: amt }, { acc: '1610', cr: amt }); detail.push({ ref: a.name, amt, kind: 'asset', id: a.id });
  }

function rentalBillLines(k, from, to, final, cin) {

  const j = post({ date: p.date, memo: tr('Expense') + ' ' + no + ' – ' + (p.desc || accName(p.acc)), src: { type: 'expense', no }, lines: L });

function bankTransfer(p) {

/* ---------- payroll (Qatar WPS style) ---------- */
function addEmployee(p) { if (!p.name) fail(tr('Name is required.')); const e = { id: uid(), code: nextNo('EMP'), name: p.name, nameAr: p.nameAr || '', role: p.role || 'Sales executive', dept: p.dept || 'Sales', basic: r2(p.basic), allowances: r2(p.allowances), joined: p.joined || today(), commissionRate: p.commissionRate === '' || p.commissionRate == null ? null : Number(p.commissionRate), qid: p.qid || '', bank: p.bank || '', iban: String(p.iban || '').replace(/\s+/g, '').toUpperCase(), active: true }; co().employees.push(e); audit('Employee added', e.code); return e; }
function runPayroll(ym, p) {
  const c = co(); if (c.payruns.find(r => r.month === ym)) fail(tr('Payroll for this month already exists.'));
  const date = p && p.date || monthEnd(ym); const lines = [];
  for (const e of c.employees.filter(x => x.active && x.joined <= date)) {
    const comms = c.commissions.filter(k => k.employeeId === e.id && !k.paid && k.date <= date);
    const comm = sum(comms, k => k.amount); const eosb = r2(e.basic * c.settings.eosbDaysPerYear / 30 / 12);
    const ud = typeof unpaidDays === 'function' ? unpaidDays(e, ym) : 0; const deduction = r2((e.basic + e.allowances) / 30 * ud);
    lines.push({ employeeId: e.id, basic: e.basic, allowances: e.allowances, commission: comm, unpaidDays: ud, deduction, net: r2(e.basic + e.allowances + comm - deduction), eosb, commIds: comms.map(k => k.id) });
  }
  if (!lines.length) fail(tr('No active employees.'));
  const gross = sum(lines, l => l.basic + l.allowances - l.deduction), comm = sum(lines, l => l.commission), eosb = sum(lines, l => l.eosb), net = sum(lines, l => l.net);
  const L = [{ acc: '6100', dr: gross }, { acc: '2300', cr: net }]; if (comm) L.push({ acc: '2310', dr: comm }); if (eosb) L.push({ acc: '6120', dr: eosb }, { acc: '2320', cr: eosb });
  const j = post({ date, memo: tr('Payroll') + ' ' + ym, src: { type: 'payroll', no: ym }, lines: L });
  lines.forEach(l => l.commIds.forEach(id => { const k = c.commissions.find(x => x.id === id); k.paid = true; k.payrun = ym; }));
  const run = { id: uid(), month: ym, date, lines, gross, comm, eosb, net, jid: j.id, paid: false }; c.payruns.push(run); audit('Payroll run', ym); return run;
}
function paySalaries(id, p) {
  const run = byId('payruns', id); if (run.paid) fail(tr('Salaries for this run are already paid.'));
  const j = post({ date: p.date, memo: tr('Salary transfer (WPS)') + ' ' + run.month, src: { type: 'payroll', id: run.id, no: run.month }, lines: [{ acc: '2300', dr: run.net }, { acc: p.bankAcc, cr: run.net }] });
  run.paid = true; run.paidOn = p.date; run.payJid = j.id; audit('Salaries paid', run.month); return run;
}

/* ---------- period control ---------- */
function setLockDate(d) { co().settings.lockDate = d; audit('Period locked through', d || '(none)'); }
function yearEndClose(year) {
  const c = co(); if (c.closedYears.includes(year)) fail(tr('This year is already closed.'));
  const from = year + '-01-01', to = year + '-12-31'; const L = []; let net = 0;
  for (const a of c.accounts.filter(x => x.type === 'R' || x.type === 'X')) {
    const b = accBalance(a.code, { from, to }); if (!b) continue;
    if (a.type === 'R') { L.push({ acc: a.code, dr: b }); net += cents(b); } else { L.push({ acc: a.code, cr: b }); net -= cents(b); }
  }
  if (!L.length) fail(tr('No income or expense to close for this year.'));
  net = net / 100; L.push(net >= 0 ? { acc: '3200', cr: net } : { acc: '3200', dr: -net });
  const j = post({ date: to, memo: tr('Year-end close') + ' ' + year, src: { type: 'close', no: year }, lines: L });
  j.closing = true; c.closedYears.push(year); c.settings.lockDate = to; audit('Year closed', year); return j;
}

/* ---------- alerts for the dashboard ---------- */
function alerts() {
  // each alert: sev, key (translatable text), val (date or number shown after the text), ref, go
  const c = co(); const t0 = today(); const soon = addDays(t0, c.settings.alertDays); const out = [];
  for (const v of c.vehicles.filter(v => v.status !== 'sold' && v.status !== 'returned')) {
    if (v.regExpiry && v.regExpiry <= soon) out.push({ sev: v.regExpiry < t0 ? 'bad' : 'warn', key: 'Registration (Istimara) expires', date: v.regExpiry, ref: v.stockNo + ' ' + (v.plate || ''), go: 'vehicle:' + v.id });
    if (v.insExpiry && v.insExpiry <= soon) out.push({ sev: v.insExpiry < t0 ? 'bad' : 'warn', key: 'Insurance expires', date: v.insExpiry, ref: v.stockNo + ' ' + (v.plate || ''), go: 'vehicle:' + v.id });
    if (v.fleet && v.km >= v.fleet.nextServiceKm - 500) out.push({ sev: v.km >= v.fleet.nextServiceKm ? 'bad' : 'warn', key: 'Service due at', val: v.fleet.nextServiceKm.toLocaleString('en-US') + ' km', ref: v.stockNo + ' ' + (v.plate || ''), go: 'vehicle:' + v.id });
  }
  for (const k of c.contracts.filter(k => k.status === 'open' && k.due < t0)) out.push({ sev: 'bad', key: 'Rental overdue since', date: k.due, ref: k.no + ' · ' + party(k.customerId).name, go: 'contract:' + k.id });
  for (const k of c.contracts.filter(k => k.status === 'closed' && k.deposit.held > 0 && k.depositReleaseOn <= t0)) out.push({ sev: 'info', key: 'Deposit ready to release', ref: k.no + ' · ' + party(k.customerId).name, go: 'contract:' + k.id });
  for (const pd of c.pdcs.filter(x => x.status === 'held' && x.chequeDate <= addDays(t0, 3))) out.push({ sev: pd.chequeDate <= t0 ? 'warn' : 'info', key: 'Cheque due for deposit', date: pd.chequeDate, ref: pd.no + ' #' + pd.chequeNo + ' · ' + party(pd.partyId).name, go: 'pdc' });
  for (const pl of c.plans.filter(p => p.status === 'active')) { const od = pl.schedule.filter(s => !s.paid && s.due < t0); if (od.length) out.push({ sev: 'bad', key: 'Installments overdue', val: od.length, ref: pl.no + ' · ' + party(pl.customerId).name, go: 'plan:' + pl.id }); }
  for (const fp of (c.floorplans || []).filter(f => f.status === 'open')) { const v = vehicle(fp.vehicleId); if (v.status === 'sold') out.push({ sev: 'bad', key: 'Sold car still on floor plan', ref: fp.no + ' · ' + vname(v), go: 'floorplan' }); else if (diffDays(fp.start, t0) > c.settings.curtailDays) out.push({ sev: 'warn', key: 'Floor-plan curtailment due (days)', val: diffDays(fp.start, t0), ref: fp.no + ' · ' + vname(v), go: 'floorplan' }); }
  if (['admin', 'manager'].includes(user().role)) { const n = (c.approvals || []).filter(a => a.status === 'pending' && a.requestedBy !== user().name).length; if (n) out.push({ sev: 'info', key: 'Requests waiting for your approval', val: n, ref: t0, go: 'approvals' }); }
  if (['admin', 'accountant'].includes(user().role)) for (const d of (c.drafts || []).filter(d => d.status === 'submitted')) out.push({ sev: 'info', key: 'Journal awaiting approval', ref: d.no + ' · ' + d.memo + ' · ' + d.preparedBy, go: 'draft:' + d.id });
  for (const it of c.items.filter(i => i.qty <= i.reorder)) out.push({ sev: 'warn', key: 'Below reorder level', val: it.qty + ' ' + it.unit, ref: it.code + ' ' + it.name, go: 'parts' });
  for (const v of c.vehicles.filter(v => v.purpose === 'sale' && ['in-stock', 'reserved'].includes(v.status) && diffDays(v.arrived, t0) > 120)) out.push({ sev: 'warn', key: 'Aged stock (days)', val: diffDays(v.arrived, t0), ref: v.stockNo + ' ' + vname(v), go: 'vehicle:' + v.id });
  const order = { bad: 0, warn: 1, info: 2 }; return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------- draft journals with maker-checker approval ---------- */
function cleanDraftLines(lines) { return (lines || []).filter(l => l.acc).map(l => ({ acc: l.acc, party: l.party || null, dr: r2(l.dr), cr: r2(l.cr), memo: l.memo || '' })); }
function saveDraft(p, id) {
  const c = co(); c.drafts = c.drafts || []; const lines = cleanDraftLines(p.lines);
  if (!p.memo) fail(tr('Enter the narration.')); if (!lines.length) fail(tr('Add at least one line.'));
  let d;
  if (id) {
    d = byId('drafts', id); if (!['draft', 'rejected'].includes(d.status)) fail(tr('Only drafts and rejected journals can be edited.'));
    if (d.preparedBy !== user().name && user().role !== 'admin') fail(tr('Only the person who prepared this journal can edit it.'));
    Object.assign(d, { date: p.date, memo: p.memo, lines, status: 'draft' }); d.history.push({ ts: new Date().toISOString(), by: user().name, action: 'Edited' });
  } else {
    d = { id: uid(), no: nextNo('DJ'), date: p.date, memo: p.memo, lines, status: 'draft', preparedBy: user().name, ts: new Date().toISOString(), history: [{ ts: new Date().toISOString(), by: user().name, action: 'Created' }] };
    c.drafts.push(d);
  }
  audit('Draft journal saved', d.no); return d;
}
function submitDraft(id) {
  const d = byId('drafts', id); if (d.status !== 'draft') fail(tr('Only drafts can be submitted.'));
  checkJournal(d.date, d.lines);   // same rules as posting, so approvers only see journals that will post
  d.status = 'submitted'; d.history.push({ ts: new Date().toISOString(), by: user().name, action: 'Submitted for approval' }); audit('Draft submitted', d.no); return d;
}
function canApprove(d) { const u = user(); if (!['admin', 'accountant'].includes(u.role)) return false; return !co().settings.requireApproval || d.preparedBy !== u.name; }
function approveDraft(id) {
  const c = co(); const d = byId('drafts', id); if (d.status !== 'submitted') fail(tr('Only submitted journals can be approved.'));
  if (!['admin', 'accountant'].includes(user().role)) fail(tr('Only an administrator or accountant can approve journals.'));
  if (c.settings.requireApproval && d.preparedBy === user().name) fail(tr('You prepared this journal, so someone else must approve it.'));
  const j = post({ date: d.date, memo: d.memo, src: { type: 'manual', id: d.id, no: d.no }, lines: d.lines });
  j.preparedBy = d.preparedBy; j.approvedBy = user().name;
  (c.files || []).forEach(f => { if (f.owner.type === 'draft' && f.owner.id === d.id) f.owner = { type: 'journal', id: j.id }; });
  d.status = 'posted'; d.jid = j.id; d.history.push({ ts: new Date().toISOString(), by: user().name, action: 'Approved and posted as ' + j.no });
  audit('Journal approved', d.no + ' → ' + j.no); return j;
}
function rejectDraft(id, reason) {
  const d = byId('drafts', id); if (d.status !== 'submitted') fail(tr('Only submitted journals can be rejected.'));
  if (!['admin', 'accountant'].includes(user().role)) fail(tr('Only an administrator or accountant can approve journals.'));
  d.status = 'rejected'; d.reason = reason || ''; d.history.push({ ts: new Date().toISOString(), by: user().name, action: 'Rejected' + (reason ? ': ' + reason : '') }); audit('Journal rejected', d.no); return d;
}
function deleteDraft(id) {
  const c = co(); const d = byId('drafts', id); if (!['draft', 'rejected'].includes(d.status)) fail(tr('Only drafts and rejected journals can be deleted.'));
  if (d.preparedBy !== user().name && user().role !== 'admin') fail(tr('Only the person who prepared this journal can delete it.'));
  c.drafts = c.drafts.filter(x => x.id !== id); audit('Draft deleted', d.no);
}
function postManualDirect(p) {
  if (co().settings.requireApproval) fail(tr('Manual journals need approval. Save as draft and submit.'));
  const j = post({ date: p.date, memo: p.memo, src: { type: 'manual' }, lines: cleanDraftLines(p.lines) }); j.preparedBy = user().name; audit('Manual journal', j.no); return j;
}

'use strict';
/* ---------- amount in words ---------- */
const W_EN_1 = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const W_EN_10 = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function enWords(n) {
  n = Math.floor(n); if (n === 0) return 'Zero';
  const h = x => { let s = ''; if (x >= 100) { s += W_EN_1[Math.floor(x / 100)] + ' Hundred'; x %= 100; if (x) s += ' and '; } if (x >= 20) { s += W_EN_10[Math.floor(x / 10)] + (x % 10 ? '-' + W_EN_1[x % 10] : ''); } else if (x) s += W_EN_1[x]; return s; };
  const parts = []; const sc = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
  for (const [v, w] of sc) if (n >= v) { parts.push(h(Math.floor(n / v)) + ' ' + w); n %= v; }
  if (n) parts.push(h(n)); return parts.join(' ');
}
const W_AR_1 = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
const W_AR_10 = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
const W_AR_100 = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
function arWords(n) {
  n = Math.floor(n); if (n === 0) return 'صفر';
  const u100 = x => x < 20 ? W_AR_1[x] : (x % 10 ? W_AR_1[x % 10] + ' و' + W_AR_10[Math.floor(x / 10)] : W_AR_10[Math.floor(x / 10)]);
  const u1000 = x => [W_AR_100[Math.floor(x / 100)], x % 100 ? u100(x % 100) : ''].filter(Boolean).join(' و');
  const scale = (x, one, two, few, many) => x === 1 ? one : x === 2 ? two : x <= 10 ? u1000(x) + ' ' + few : u1000(x) + ' ' + many;

/* logo upload for letterhead: scaled to 480px PNG */
async function logoFromFile(file) {
  if (!/^image\//.test(file.type)) fail(t('Choose an image file for the logo.'));
  const bmp = await createImageBitmap(file); const s = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/png');
}

'use strict';
const STREAMS = [
  { k: 'Vehicle sales', accs: ['4100', '4110', '4150', '4200'], color: 'var(--c1)' },
  { k: 'Rental', accs: ['4300', '4310', '4320'], color: 'var(--c2)' },
  { k: 'Workshop & parts', accs: ['4500', '4510'], color: 'var(--c3)' },
  { k: 'Finance & other', accs: ['4400', '4600'], color: 'var(--c4)' }
];
function revenueByMonth(n) {
  const out = []; const t0 = today();
  for (let i = n - 1; i >= 0; i--) { const ym = monthOf(addMonths(t0.slice(0, 7) + '-01', -i)); const from = ym + '-01', to = monthEnd(ym); out.push({ ym, label: fmonth(ym), parts: STREAMS.map(s => sum(s.accs, a => accBalance(a, { from, to }))) }); }
  return out;
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function stackedBars(data, series) {
  const W = 640, H = 240, L = 52, R = 10, T = 12, B = 28; const iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(...data.map(d => d.parts.reduce((a, b) => a + Math.max(0, b), 0)), 1));
  const y = v => T + ih - v / max * ih; const bw = iw / data.length * 0.56;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  data.forEach((d, i) => {
    const cx = L + iw / data.length * (i + .5); let acc0 = 0;
    d.parts.forEach((v, si) => { v = Math.max(0, v); if (!v) return; const y1 = y(acc0 + v), y0 = y(acc0); g += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0.5, y0 - y1)}" fill="${series[si].color}" rx="1.5"><title>${esc(t(series[si].k))}: ${money0(v)}</title></rect>`; acc0 += v; });
    g += `<text x="${cx}" y="${H - 9}" text-anchor="middle">${esc(d.label)}</text>`;
    if (i === data.length - 1) g += `<text x="${cx}" y="${y(acc0) - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${kfmt(acc0)}</text>`;
  });
  return `<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Revenue by month')}">${g}</svg></div><div class="legend" style="margin-top:6px">${series.map(s => `<span><i style="background:${s.color}"></i>${t(s.k)}</span>`).join('')}</div>`;
}

VIEWS.dash = () => {
  const c = co(); const t0 = today(); const m0 = monthOf(t0) + '-01'; const fin = can('finance') || can('reports');
  const delivered = c.deals.filter(d => d.status === 'delivered' && d.deliveredOn >= m0);
  const pl = profitAndLoss(m0, t0);
  const fleet = c.vehicles.filter(v => v.purpose === 'fleet'); const onRent = fleet.filter(v => v.status === 'on-rent').length;
  const cash = sum(cashAccounts(), a => accBalance(a.code));
  const ar = r2(accBalance('1100') + accBalance('1110') + accBalance('1120'));
  const stock = c.vehicles.filter(v => v.purpose === 'sale' && v.source !== 'consignment' && ['in-stock', 'reserved'].includes(v.status));
  const al = alerts();
  let k = '';
  if (can('sales')) k += kpi(t('Cars delivered this month'), delivered.length, money0(sum(delivered, d => dealCalc(d).net)) + ' ' + curr(), true);
  if (fin) k += kpi(t('Revenue this month'), money0(pl.totRev), t('Gross profit') + ' ' + money0(pl.gross));
  if (can('rental')) k += kpi(t('Fleet on rent'), onRent + ' / ' + fleet.length, Math.round(onRent / Math.max(1, fleet.length) * 100) + '% ' + t('utilisation today'), !can('sales'));
  if (fin) k += kpi(t('Bank & cash'), money0(cash), t('Receivables') + ' ' + money0(ar));
  if (can('stock')) k += kpi(t('Cars in stock'), stock.length, money0(sum(stock, vcost)) + ' ' + t('at cost'));
  if (can('workshop')) k += kpi(t('Open job cards'), c.jobs.filter(j => j.status === 'open').length, t('Workshop'));
  const returns = c.contracts.filter(x => x.status === 'open' && x.due <= addDays(t0, 1)).sort((a, b) => a.due.localeCompare(b.due));
  const pickups = c.reservations.filter(r => r.status === 'reserved' && r.from <= addDays(t0, 7) && r.from >= t0);
  const recent = c.deals.filter(d => d.status !== 'cancelled').sort((a, b) => (b.deliveredOn || b.date).localeCompare(a.deliveredOn || a.date)).slice(0, 7);
  const left = [];
  if (fin) left.push(card(t('Revenue by stream'), stackedBars(revenueByMonth(6), STREAMS), { right: `<span class="muted small">${t('Last 6 months')} · ${curr()}</span>` }));
  if (can('sales')) left.push(card(t('Latest deals'), table([
    { h: t('Deal'), f: d => `<b>${d.no}</b><div class="muted small">${fdate(d.deliveredOn || d.date)}</div>` },
    { h: t('Vehicle'), f: d => vlabel(vehicle(d.vehicleId)) },
    { h: t('Customer'), f: d => esc(nm(party(d.customerId))) },
    { h: t('Status'), f: d => badge(d.status) },
    { h: t('Price'), cls: 'num', f: d => money0(dealCalc(d).net) }
  ], recent, { go: d => 'deal:' + d.id }), { flush: true, right: `<a href="#deals" data-go="deals" class="small">${t('All deals')}</a>` }));
  if (can('rental')) left.push(card(t('Returns due & pickups'), table([
    { h: t('Agreement'), f: x => `<b>${x.no}</b>` }, { h: t('Vehicle'), f: x => plate(vehicle(x.vehicleId).plate) + ' <span class="small">' + esc(vname(vehicle(x.vehicleId))) + '</span>' },
    { h: t('Customer'), f: x => esc(nm(party(x.customerId))) }, { h: t('Due'), f: x => fdate(x.due || x.from) + (x.due && x.due < t0 ? ' ' + badge('overdue', t('Overdue')) : '') }
  ], [...returns, ...pickups.map(r => ({ ...r, isRes: true, due: null }))].map(x => x.isRes ? { ...x, no: x.no + ' · ' + t('pickup') } : x), { go: x => x.isRes ? 'reservations' : 'contract:' + x.id, empty: t('No returns or pickups due.') }), { flush: true }));
  const right = [card(t('Needs attention') + ` <span class="b ${al.some(a => a.sev === 'bad') ? 'bad' : 'warn'}">${al.length}</span>`, al.length ? `<ul class="alerts">${al.slice(0, 14).map(a => `<li data-go="${esc(a.go)}"><span class="sev ${a.sev}"></span><div><div>${esc(t(a.key))}${a.date ? ' ' + fdate(a.date) : a.val != null ? ': <bdi dir="ltr">' + esc(a.val) + '</bdi>' : ''}</div><div class="muted small">${esc(a.ref)}</div></div></li>`).join('')}</ul>` : `<div class="empty">${t('All clear.')}</div>`, { flush: true })];
  if (can('rental')) {
    const st = ['available', 'on-rent', 'maintenance'].map(s => [s, fleet.filter(v => v.status === s).length]);
    right.push(card(t('Fleet status'), `<div class="stack" style="gap:10px">${st.map(([s, n]) => `<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px">${badge(s)}<div class="bar-mini ${s === 'on-rent' ? 'acc' : ''}" style="flex:1"><i style="width:${n / Math.max(1, fleet.length) * 100}%"></i></div><b class="num">${n}</b></div>`).join('')}</div>`));
  }
  return ph(t('Good day') + (LANG === 'ar' ? '، ' : ', ') + '<bdi>' + esc(user().name.split(' ')[0]) + '</bdi>', { eyebrow: nm(c), sub: fdate(t0) + ' · ' + t(ROLES[user().role].label),
    actions: (can('sales') ? btn(t('New deal'), 'newDeal', { cls: 'primary' }) : '') + (can('rental') ? btn(t('Check out a car'), 'checkOut', { cls: can('sales') ? '' : 'primary' }) : '') + (can('workshop') ? btn(t('Open job card'), 'newJob') : '') }) +
    `<div class="kpis">${k}</div><div class="cols"><div class="stack">${left.join('')}</div><div class="stack">${right.join('')}</div></div>`;
};

function histText(s) {
  const m = s.match(/^(Reserved on|Released from|Delivered on|Rented on|Returned from|In workshop|Workshop done) (\S+)(.*)$/);

}

/* ---------------- bank & cash ---------------- */
VIEWS.banking = () => {
  const c = co(); const tab = uiTab('bank', 'accounts');
  const accs = cashAccounts(); const sel = UI.q.bankAcc || '1030';
  const head = ph(t('Bank & cash'), { eyebrow: t('Finance'), actions: btn(t('Transfer'), 'transfer', { cls: 'primary' }) + btn(t('Record expense'), 'newExpense') }) +
    `<div class="kpis">${accs.map(a => kpi(accName(a.code), money0(accBalance(a.code)), a.code, a.code === sel)).join('')}</div>` +
    tabs('bank', [['accounts', t('Cash book')], ['recon', t('Reconciliation')], ['transfers', t('Transfers'), c.transfers.length]], tab);
  const lines = []; for (const j of c.journals) j.lines.forEach((l, ix) => { if (l.acc === sel) lines.push({ j, l, key: j.id + ':' + ix }); });
  lines.sort((a, b) => a.j.date.localeCompare(b.j.date) || a.j.ts.localeCompare(b.j.ts));
  const accPick = `<div class="filters">${filterSel('bankAcc', accs.map(a => [a.code, a.code + ' · ' + accName(a.code)]), t('Account'))}</div>`;
  if (tab === 'accounts') {
    const r = UI.q.bankFrom || addDays(today(), -60); let bal = accBalance(sel, { to: addDays(r, -1) }); const open0 = bal;
    const rows = lines.filter(x => x.j.date >= r).map(x => { bal = r2(bal + x.l.dr - x.l.cr); return { ...x, bal }; });
    return head + `<div class="filters">${filterSel('bankAcc', accs.map(a => [a.code, a.code + ' · ' + accName(a.code)]), t('Account'))}<label class="who"><span>${t('From')}</span><input type="date" data-filter="bankFrom" value="${r}"></label></div>` +
      card(null, `<div class="muted small" style="padding:10px 16px">${t('Opening balance')} ${fdate(r)}: <b>${money(open0)}</b></div>` + table([{ h: t('Date'), f: x => fdate(x.j.date) }, { h: t('Ref'), f: x => `<a href="#" data-go="journal:${x.j.id}">${x.j.no}</a>` }, { h: t('Details'), f: x => esc(x.j.memo) }, { h: t('In'), cls: 'num', f: x => x.l.dr ? money(x.l.dr) : '' }, { h: t('Out'), cls: 'num', f: x => x.l.cr ? money(x.l.cr) : '' }, { h: t('Balance'), cls: 'num', f: x => `<b>${money(x.bal)}</b>` }], rows.reverse()), { flush: true });
  }
  if (tab === 'recon') {
    const rc = c.recon[sel] = c.recon[sel] || { statementDate: today(), statementBalance: null, cleared: {} };
    const upto = lines.filter(x => x.j.date <= rc.statementDate);
    const cleared = upto.filter(x => rc.cleared[x.key]); const unc = upto.filter(x => !rc.cleared[x.key]);
    const clearedBal = r2(sum(cleared, x => x.l.dr - x.l.cr)); const bookBal = accBalance(sel, { to: rc.statementDate });
    const stmt = rc.statementBalance == null ? null : Number(rc.statementBalance); const diff = stmt == null ? null : r2(stmt - clearedBal);
    return head + accPick + `<div class="kpis">${kpi(t('Book balance'), money(bookBal), fdate(rc.statementDate))}${kpi(t('Cleared balance'), money(clearedBal), cleared.length + ' ' + t('items'))}${kpi(t('Statement balance'), stmt == null ? '—' : money(stmt), '', true)}${kpi(t('Difference'), diff == null ? '—' : money(diff), diff === 0 ? t('Reconciled') : t('Tick items that appear on the statement'))}</div>` +
      card(t('Statement'), `<div class="grid g3" style="max-width:640px"><label class="fld"><span>${t('Statement date')}</span><input type="date" id="rc-date" value="${rc.statementDate}"></label><label class="fld"><span>${t('Statement closing balance')}</span><input type="number" step="any" id="rc-bal" value="${stmt == null ? '' : stmt}"></label><div class="fld"><span>&nbsp;</span>${btn(t('Update'), 'reconSet', { arg: sel })}</div></div>`) + '<div style="height:12px"></div>' +
      card(t('Items up to statement date'), `<div class="filters" style="padding:10px 16px 0">${btn(t('Tick all'), 'reconAll', { arg: sel, cls: 'sm' })}</div>` + table([{ h: '', f: x => `<input type="checkbox" data-act="reconTick" data-id="${x.key}" data-arg="${sel}" ${rc.cleared[x.key] ? 'checked' : ''} aria-label="${t('Cleared')}">` }, { h: t('Date'), f: x => fdate(x.j.date) }, { h: t('Ref'), f: x => x.j.no }, { h: t('Details'), f: x => esc(x.j.memo) }, { h: t('In'), cls: 'num', f: x => x.l.dr ? money(x.l.dr) : '' }, { h: t('Out'), cls: 'num', f: x => x.l.cr ? money(x.l.cr) : '' }], [...unc.reverse(), ...cleared.reverse()]), { flush: true });
  }
  return head + card(null, table([{ h: t('Transfer'), f: x => `<b>${x.no}</b>` }, { h: t('Date'), f: x => fdate(x.date) }, { h: t('From'), f: x => esc(accName(x.from)) }, { h: t('To'), f: x => esc(accName(x.to)) }, { h: t('Memo'), f: x => esc(x.memo) }, { h: t('Amount'), cls: 'num', f: x => money(x.amount) }], c.transfers.slice().reverse(), { go: x => 'journal:' + x.jid }), { flush: true });
};

function aging(docs, openF, labelParty) {
  const t0 = UI.q.agTo || today(); const B = [[t('Current'), -1e9, 0], ['1–30', 1, 30], ['31–60', 31, 60], ['61–90', 61, 90], ['90+', 91, 1e9]];
  const byP = {};
  for (const d of docs) { const o = openF(d); if (o <= 0 || d.date > t0) continue; const age = diffDays(d.due, t0); const bi = B.findIndex(b => age >= b[1] && age <= b[2]); const k = d.partyId; byP[k] = byP[k] || { p: party(k), b: [0, 0, 0, 0, 0] }; byP[k].b[bi] = r2(byP[k].b[bi] + o); }
  const rows = Object.values(byP).sort((a, b) => sum(b.b) - sum(a.b)); const tot = [0, 1, 2, 3, 4].map(i => sum(rows, r => r.b[i]));
  const html = card(null, table([{ h: labelParty, f: r => `<a href="#" data-go="party:${r.p.id}">${esc(nm(r.p))}</a> <span class="muted small">${t(r.p.type)}</span>` }, ...B.map((b, i) => ({ h: b[0], cls: 'num', f: r => r.b[i] ? `<span class="${i >= 3 ? 'neg' : ''}">${money(r.b[i])}</span>` : '' })), { h: t('Total'), cls: 'num', f: r => `<b>${money(sum(r.b))}</b>` }], rows, { foot: `<td>${t('Total')}</td>${tot.map(v => `<td class="num">${money(v)}</td>`).join('')}<td class="num">${money(sum(tot))}</td>` }), { flush: true });
  return { html, csv: [['Party', ...B.map(b => b[0]), 'Total'], ...rows.map(r => [r.p.name, ...r.b, sum(r.b)])], filters: `<label class="who"><span>${t('As at')}</span><input type="date" data-filter="agTo" value="${t0}"></label>` };
}

/* ==========================================================================
   MARKABA — business modules, batch 4 (DOM-free; tested in Node)
   Approvals · floor-plan loans · import purchase orders · workshop appointments
   · leave & WPS · branch P&L · budgets
   ========================================================================== */
'use strict';
const nowISO = () => new Date().toISOString();

/* ---------- approvals (maker-checker for prices and refunds) ---------- */
function requestApproval(type, refId, p) {
  const c = co(); c.approvals = c.approvals || [];
  c.approvals.filter(a => a.type === type && a.refId === refId && a.status === 'pending').forEach(a => { a.status = 'superseded'; });
  const a = { id: uid(), no: nextNo('APR'), type, refId, status: 'pending', requestedBy: user().name, ts: nowISO(), summary: p.summary || '', amount: r2(p.amount || 0), params: p.params || null };
  c.approvals.push(a); audit('Approval requested', a.no + ' · ' + type); return a;
}
function canDecide(a) { const u = user(); return ['admin', 'manager'].includes(u.role) && a.requestedBy !== u.name; }
function decideApproval(id, approve, reason) {
  const c = co(); const a = byId('approvals', id); if (!a || a.status !== 'pending') fail(tr('This request is no longer pending.'));
  if (!['admin', 'manager'].includes(user().role)) fail(tr('Only a manager or administrator can approve.'));
  if (a.requestedBy === user().name) fail(tr('You raised this request, so someone else must decide it.'));
  a.status = approve ? 'approved' : 'rejected'; a.decidedBy = user().name; a.decidedAt = nowISO(); a.reason = reason || '';
  if (a.type === 'discount') { const d = byId('deals', a.refId); if (d && d.approval) { d.approval.status = a.status; d.approval.decidedBy = user().name; d.approval.reason = a.reason; if (approve) d.approvedBy = user().name; } }
  if (a.type === 'refund') { const d = byId('deals', a.refId); d.cancelPending = false; if (approve) cancelDeal(d.id, { ...a.params, _approved: true }); }
  if (a.type === 'leave') { const l = byId('leaves', a.refId); l.status = a.status; l.decidedBy = user().name; }
  audit(approve ? 'Approved' : 'Rejected', a.no + ' · ' + a.type); return a;
}

/* ---------- floor-plan financing (per car) ---------- */
function openFloorplan(v, amount, date) {
  const c = co(); c.floorplans = c.floorplans || [];
  const fp = { id: uid(), no: nextNo('FP'), vehicleId: v.id, lender: c.settings.floorplanLender, principal: r2(amount), rate: Number(c.settings.floorplanRate), start: date, accruedTo: date, accrued: 0, status: 'open' };
  c.floorplans.push(fp); return fp;
}
function fpInterest(fp, from, to) { const d = Math.max(0, diffDays(from, to)); return r2(fp.principal * fp.rate / 100 * d / 365); }
function runFloorplanAccrual(ym) {
  const c = co(); c.fpRuns = c.fpRuns || []; if (c.fpRuns.includes(ym)) fail(tr('Floor-plan interest for this month is already accrued.'));
  const end = monthEnd(ym); const L = []; const upd = [];
  for (const fp of (c.floorplans || []).filter(f => f.status === 'open' && f.accruedTo < end)) { const amt = fpInterest(fp, fp.accruedTo, end); if (amt > 0) { L.push({ acc: '6280', dr: amt, vehicle: fp.vehicleId }, { acc: '2500', cr: amt, memo: fp.no }); upd.push([fp, amt]); } }
  if (!L.length) { c.fpRuns.push(ym); return null; }
  const j = post({ date: end, memo: tr('Floor-plan interest accrual') + ' ' + ym, src: { type: 'floorplan', no: ym }, lines: L });
  for (const [fp, amt] of upd) { fp.accrued = r2(fp.accrued + amt); fp.accruedTo = end; }
  c.fpRuns.push(ym); audit('Floor-plan interest accrued', ym); return j;
}
function settleFloorplan(id, p) {
  const fp = byId('floorplans', id); if (!fp || fp.status !== 'open') fail(tr('This floor-plan loan is already settled.'));
  if (p.date < fp.accruedTo) fail(tr('Settlement date is before the last interest accrual.'));
  if (!p.bankAcc || !acc(p.bankAcc).cash) fail(tr('Choose a bank or cash account.'));
  const tail = fpInterest(fp, fp.accruedTo, p.date); const total = r2(fp.principal + fp.accrued + tail);
  const L = [{ acc: '2600', dr: fp.principal, vehicle: fp.vehicleId }, { acc: p.bankAcc, cr: total }];
  if (fp.accrued) L.push({ acc: '2500', dr: fp.accrued, memo: fp.no }); if (tail) L.push({ acc: '6280', dr: tail, vehicle: fp.vehicleId });
  const j = post({ date: p.date, memo: tr('Floor-plan settlement') + ' ' + fp.no + ' – ' + vehicle(fp.vehicleId).vin, src: { type: 'floorplan', id: fp.id, no: fp.no }, lines: L });
  Object.assign(fp, { status: 'settled', settledOn: p.date, interestPaid: r2(fp.accrued + tail), jid: j.id }); audit('Floor-plan settled', fp.no); return fp;
}
function fpStatus(fp) { const T = today(); const v = vehicle(fp.vehicleId); return { days: diffDays(fp.start, fp.status === 'open' ? T : fp.settledOn), owing: fp.status === 'open' ? r2(fp.principal + fp.accrued + fpInterest(fp, fp.accruedTo, T)) : 0, sold: v.status === 'sold' }; }

/* ---------- import purchase orders & shipments ---------- */
function createPO(p) {
  const c = co(); c.pos = c.pos || []; if (!party(p.supplierId)) fail(tr('Choose a supplier.'));
  const lines = (p.lines || []).filter(l => l.make && l.model && Number(l.qty) > 0 && Number(l.unitCost) > 0).map(l => ({ make: l.make, model: l.model, trim: l.trim || '', year: Number(l.year) || new Date().getFullYear(), color: l.color || '', body: l.body || 'SUV', qty: Number(l.qty), unitCost: r2(l.unitCost), listPrice: r2(l.listPrice || 0) }));
  if (!lines.length) fail(tr('Add at least one line.'));
  const fx = p.currency === 'QAR' ? 1 : Number(p.fxRate); if (!(fx > 0)) fail(tr('Enter the exchange rate.'));
  const po = { id: uid(), no: nextNo('PO'), date: p.date, supplierId: p.supplierId, currency: p.currency || 'USD', fxRate: fx, lines, status: 'ordered', eta: p.eta || '', ref: p.ref || '', costs: [], vehicleIds: [], history: [{ ts: nowISO(), by: user().name, action: 'Ordered' }] };
  c.pos.push(po); audit('Purchase order', po.no); return po;
}
function poValue(po) { return sum(po.lines, l => l.qty * l.unitCost); }
function poUnits(po) { return sum(po.lines, l => l.qty); }

/* ---------- branch P&L ---------- */
